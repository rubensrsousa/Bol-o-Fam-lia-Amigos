// ============================================================
// MOTOR DE CLASSIFICAÇÃO (baseado nos palpites do participante)
// ============================================================
function classificarGrupo(gl, palpites) {
  var info = G[gl], pts={}, sg={}, gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  info.jogos.forEach(function(j){
    var p = palpites['g'+j.id];
    if(!p||p.a==null||p.b==null) return;
    var a=+p.a,b=+p.b; if(isNaN(a)||isNaN(b)) return;
    gp[j.t1]+=a;gp[j.t2]+=b;
    sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]+=1;pts[j.t2]+=1;}
  });
  return info.times.slice().sort(function(a,b){
    if(pts[b]!==pts[a])return pts[b]-pts[a];
    if(sg[b]!==sg[a])return sg[b]-sg[a];
    return gp[b]-gp[a];
  }).map(function(t){return{nome:t,pts:pts[t],sg:sg[t],gp:gp[t]};});
}

function calcTerceiros(palpites) {
  var lista=[];
  Object.keys(G).forEach(function(gl){
    var r=classificarGrupo(gl,palpites);
    var temP=G[gl].jogos.some(function(j){var p=palpites['g'+j.id];return p&&p.a!=null&&p.b!=null;});
    lista.push({nome:temP?r[2].nome:null,grupo:gl,pts:r[2].pts,sg:r[2].sg,gp:r[2].gp,tem:temP});
  });
  lista.sort(function(a,b){
    if(!a.tem&&!b.tem)return 0;if(!a.tem)return 1;if(!b.tem)return -1;
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.sg!==a.sg)return b.sg-a.sg;
    return b.gp-a.gp;
  });
  return lista;
}

function resolveGrupo(ref, palpites) {
  if(ref.g){
    var r=classificarGrupo(ref.g,palpites);
    var tem=G[ref.g].jogos.some(function(j){var p=palpites['g'+j.id];return p&&p.a!=null&&p.b!=null;});
    if(!tem)return null;
    return r[ref.p-1]?r[ref.p-1].nome:null;
  }
  if(ref.tc!==undefined){
    var tc=calcTerceiros(palpites);
    var item=tc[ref.tc-1];
    return (item&&item.nome)?item.nome+'(3°'+item.grupo+')':null;
  }
  return null;
}

// Resolve vencedor de uma segunda/oitava/quarta/semi a partir dos palpites
function resolveVencedor(jogoId, palpites) {
  var p = palpites['mm'+jogoId];
  if(!p||p.v==null) return null;
  // p.v = nome do time vencedor (digitado/salvo)
  return p.v||null;
}

function resolvePerdedor(jogoId, palpites) {
  var p = palpites['mm'+jogoId];
  if(!p||p.v==null) return null;
  return p.p||null;
}

function resolveTimeSegunda(ref, palpites) {
  if(ref.g||ref.tc!==undefined) return resolveGrupo(ref,palpites);
  if(ref.s!==undefined) return resolveVencedor(ref.s,palpites);
  if(ref.o!==undefined) return resolveVencedor(ref.o,palpites);
  if(ref.q!==undefined) return resolveVencedor(ref.q,palpites);
  if(ref.sv!==undefined) return resolveVencedor(ref.sv,palpites);
  if(ref.sl!==undefined) return resolvePerdedor(ref.sl,palpites);
  return null;
}

// ============================================================
// CÁLCULO DE PONTOS
// ============================================================
function calcPontos(participante){
  var palpites=participante.palpites||{};
  var total=0, acertos=0, exatos=0;

  // Fase de grupos
  for(var gl in G){
    G[gl].jogos.forEach(function(j){
      var res=resultadosOficiais['g'+j.id];
      var palp=palpites['g'+j.id];
      if(!res||res.a==null||res.b==null) return;
      if(!palp||palp.a==null||palp.b==null) return;
      var ra=+res.a,rb=+res.b,pa=+palp.a,pb=+palp.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb)){total+=5;acertos++;}
    });
    // Bônus 1° e 2° do grupo
    var rClass=resultadosOficiais['class_'+gl];
    var pClass=palpites['class_'+gl];
    if(rClass&&pClass){
      if(rClass.p1&&pClass.p1===rClass.p1) total+=5;
      if(rClass.p2&&pClass.p2===rClass.p2) total+=5;
    }
  }

  // Mata-mata: resultado + bônus por classificado
  var fases=[
    {jogos:SEG, bonus:BONUS.segundas},
    {jogos:OIT, bonus:BONUS.oitavas},
    {jogos:QUA, bonus:BONUS.quartas},
    {jogos:SEMI, bonus:BONUS.semi},
    {jogos:[TERC,FINAL], bonus:0}
  ];
  fases.forEach(function(fase){
    fase.jogos.forEach(function(j){
      var res=resultadosOficiais['mm'+j.id];
      var palp=palpites['mm'+j.id];
      if(!res||res.a==null||res.b==null) return;
      if(!palp||palp.a==null||palp.b==null) return;
      var ra=+res.a,rb=+res.b,pa=+palp.a,pb=+palp.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)){total+=5;acertos++;}
      // Bônus classificado
      if(fase.bonus>0&&res.v&&palp.v===res.v) total+=fase.bonus;
    });
  });

  // Bônus especiais final
  var resFinal=resultadosOficiais['mm'+FINAL.id];
  if(resFinal&&resFinal.v){
    var pFinal=palpites['mm'+FINAL.id];
    if(pFinal){
      // Acertar quem vai à final (+30 cada time)
      var rTeams=[resFinal.v,resFinal.p].filter(Boolean);
      var pTeams=[(pFinal.v),(pFinal.p)].filter(Boolean);
      rTeams.forEach(function(t){if(pTeams.indexOf(t)>=0)total+=30;});
      // Campeão +50 já está implícito no bônus classificado da semi? Não — é extra
      // Vice +45
      if(resFinal.p&&pFinal.p===resFinal.p) total+=45;
      // Campeão +50 (além do bônus de semi)
      if(pFinal.v===resFinal.v) total+=50;
    }
  }
  var resTerc=resultadosOficiais['mm'+TERC.id];
  if(resTerc&&resTerc.v){
    var pTerc=palpites['mm'+TERC.id];
    if(pTerc&&pTerc.v===resTerc.v) total+=40;
  }

  return {total:total, acertos:acertos, exatos:exatos};
}

// ============================================================
// RANKING
// ============================================================
function renderRanking(){
  if(tabAtual!=='ranking') return;
  var lista=todosParticipantes.map(function(p){
    var r=calcPontos(p);
    return {nome:p.nome,total:r.total,acertos:r.acertos,exatos:r.exatos};
  }).sort(function(a,b){return b.total-a.total||b.exatos-a.exatos||b.acertos-a.acertos;});

  var html='<div class="card"><div class="card-head">&#127942; CLASSIFICAÇÃO GERAL <span>'+lista.length+' participantes · atualização em tempo real</span></div>';
  if(lista.length===0){
    html+='<div style="padding:30px;text-align:center;color:#6b7899">Aguardando participantes...</div>';
  } else {
    html+='<table><thead><tr><th>#</th><th>Participante</th><th>Acertos</th><th>Exatos</th><th style="text-align:right">Pontos</th></tr></thead><tbody>';
    lista.forEach(function(p,i){
      var cls=i===0?'p1':i===1?'p2':i===2?'p3':'';
      html+='<tr><td class="pos '+cls+'">'+(i+1)+'</td><td><b>'+p.nome+'</b></td><td>'+p.acertos+'</td><td>'+p.exatos+'</td><td class="pts">'+p.total+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div>';

  // Stats
  html+='<div class="card"><div class="card-head">&#128200; ESTATÍSTICAS</div><div class="stat-grid">';
  html+='<div class="stat-box"><div class="stat-num">'+lista.length+'</div><div class="stat-lbl">Participantes</div></div>';
  var jogosRes=Object.keys(resultadosOficiais).filter(function(k){var r=resultadosOficiais[k];return r&&r.a!=null;}).length;
  html+='<div class="stat-box"><div class="stat-num">'+jogosRes+'</div><div class="stat-lbl">Jogos com resultado</div></div>';
  var lider=lista[0];
  html+='<div class="stat-box"><div class="stat-num">'+(lider?lider.total:0)+'</div><div class="stat-lbl">Maior pontuação</div></div>';
  html+='</div></div>';
  document.getElementById('tabRanking').innerHTML=html;
}

// ============================================================
// RESULTADOS OFICIAIS
// ============================================================
function renderResultados(){
  if(tabAtual!=='resultados') return;
  var html='';

  // Grupos
  html+='<div class="card"><div class="card-head">&#9917; FASE DE GRUPOS <button class="btn-salvar-res" onclick="salvarResultados()">&#128190; Salvar Resultados</button></div>';
  for(var gl in G){
    html+='<div style="background:#111827;padding:5px 12px;font-size:.72rem;font-weight:900;color:#f5d400;letter-spacing:1px">GRUPO '+gl+'</div>';
    G[gl].jogos.forEach(function(j){
      var r=resultadosOficiais['g'+j.id]||{};
      var va=r.a!=null?r.a:'',vb=r.b!=null?r.b:'';
      html+='<div class="res-row"><span class="rjn">#'+j.id+'</span>'
        +'<span class="rtn">'+j.t1+'</span>'
        +'<input class="ri'+(va!==''?' ok':'')+'" type="number" inputmode="numeric" min="0" max="20" id="res_g'+j.id+'a" value="'+(va!==''?va:'')+'" placeholder="-">'
        +'<span class="rvs">&#215;</span>'
        +'<input class="ri'+(vb!==''?' ok':'')+'" type="number" inputmode="numeric" min="0" max="20" id="res_g'+j.id+'b" value="'+(vb!==''?vb:'')+'" placeholder="-">'
        +'<span class="rtn rtnr">'+j.t2+'</span></div>';
    });
  }
  html+='</div>';

  // Mata-mata
  var fasesMM=[
    {label:'SEGUNDAS DE FINAL',jogos:SEG,pfx:'seg'},
    {label:'OITAVAS DE FINAL',jogos:OIT,pfx:'oit'},
    {label:'QUARTAS DE FINAL',jogos:QUA,pfx:'qua'},
    {label:'SEMIFINAIS',jogos:SEMI,pfx:'sem'},
    {label:'3° LUGAR E FINAL',jogos:[TERC,FINAL],pfx:'fin'}
  ];
  fasesMM.forEach(function(fase){
    html+='<div class="card"><div class="card-head">'+fase.label+' <button class="btn-salvar-res" onclick="salvarResultados()">&#128190; Salvar</button></div>';
    fase.jogos.forEach(function(j){
      var r=resultadosOficiais['mm'+j.id]||{};
      var va=r.a!=null?r.a:'',vb=r.b!=null?r.b:'';
      var t1=resolveTimeAdmin(j.t1)||'?';
      var t2=resolveTimeAdmin(j.t2)||'?';
      html+='<div class="res-row"><span class="rjn">#'+j.id+'</span>'
        +'<span class="rtn">'+t1+'</span>'
        +'<input class="ri'+(va!==''?' ok':'')+'" type="number" inputmode="numeric" min="0" max="20" id="res_mm'+j.id+'a" value="'+(va!==''?va:'')+'" placeholder="-">'
        +'<span class="rvs">&#215;</span>'
        +'<input class="ri'+(vb!==''?' ok':'')+'" type="number" inputmode="numeric" min="0" max="20" id="res_mm'+j.id+'b" value="'+(vb!==''?vb:'')+'" placeholder="-">'
        +'<span class="rtn rtnr">'+t2+'</span></div>';
    });
    html+='</div>';
  });
  document.getElementById('tabResultados').innerHTML=html;
}

function resolveTimeAdmin(ref){
  // Usa resultados oficiais para resolver times no mata-mata do admin
  if(ref.g) {
    // Classificação baseada nos resultados dos grupos
    return '1°/2° Grupo '+ref.g+' (pos '+ref.p+')';
  }
  if(ref.tc!==undefined) return '3° colocado #'+ref.tc;
  if(ref.s!==undefined){var r=resultadosOficiais['mm'+ref.s];return r&&r.v?r.v:'Venc. #'+ref.s;}
  if(ref.o!==undefined){var r=resultadosOficiais['mm'+ref.o];return r&&r.v?r.v:'Venc. #'+ref.o;}
  if(ref.q!==undefined){var r=resultadosOficiais['mm'+ref.q];return r&&r.v?r.v:'Venc. #'+ref.q;}
  if(ref.sv!==undefined){var r=resultadosOficiais['mm'+ref.sv];return r&&r.v?r.v:'Venc. #'+ref.sv;}
  if(ref.sl!==undefined){var r=resultadosOficiais['mm'+ref.sl];return r&&r.p?r.p:'Perd. #'+ref.sl;}
  return '?';
}

window.salvarResultados = function(){
  // Lê todos os campos de resultado
  for(var gl in G){
    G[gl].jogos.forEach(function(j){
      var ea=document.getElementById('res_g'+j.id+'a');
      var eb=document.getElementById('res_g'+j.id+'b');
      if(!ea||!eb) return;
      var va=ea.value.trim(),vb=eb.value.trim();
      if(va!==''&&vb!==''){
        var a=parseInt(va),b=parseInt(vb);
        var v=a>b?j.t1:b>a?j.t2:null;
        var p=a>b?j.t2:b>a?j.t1:null;
        resultadosOficiais['g'+j.id]={a:a,b:b,v:v,p:p};
        if(ea)ea.classList.add('ok');if(eb)eb.classList.add('ok');
      }
    });
  }
  var todasMM=[].concat(SEG,OIT,QUA,SEMI,[TERC,FINAL]);
  todasMM.forEach(function(j){
    var ea=document.getElementById('res_mm'+j.id+'a');
    var eb=document.getElementById('res_mm'+j.id+'b');
    if(!ea||!eb) return;
    var va=ea.value.trim(),vb=eb.value.trim();
    if(va!==''&&vb!==''){
      var a=parseInt(va),b=parseInt(vb);
      // Para mata-mata precisamos saber os times — usa o resolveTimeAdmin
      var t1n=resolveTimeAdmin(j.t1),t2n=resolveTimeAdmin(j.t2);
      var v=a>b?t1n:b>a?t2n:null;
      var p=a>b?t2n:b>a?t1n:null;
      resultadosOficiais['mm'+j.id]={a:a,b:b,v:v,p:p};
      if(ea)ea.classList.add('ok');if(eb)eb.classList.add('ok');
    }
  });
  db.collection('admin').doc('resultados').set({resultados:resultadosOficiais,ts:Date.now()}).then(function(){
    showToast('&#x2705; Resultados salvos!');
    renderRanking();
  }).catch(function(){showToast('&#x26A0; Erro ao salvar');});
};

// ============================================================
// PALPITES
// ============================================================
function renderPalpites(){
  if(tabAtual!=='palpites') return;
  var html='<div class="card"><div class="card-head">&#128203; PALPITES DOS PARTICIPANTES <span>'+todosParticipantes.length+' enviados</span></div>';
  if(todosParticipantes.length===0){
    html+='<div style="padding:30px;text-align:center;color:#6b7899">Aguardando palpites...</div>';
  }
  for(var idx=0;idx<todosParticipantes.length;idx++){
    var p=todosParticipantes[idx];
    var pal=p.palpites||{};
    var jogosP=0;
    for(var k in pal){if(pal[k]&&pal[k].a!=null&&pal[k].b!=null)jogosP++;}
    var r=calcPontos(p);
    html+='<div style="border-bottom:1px solid #1e293b">'
      +'<div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center">'+'<div style="cursor:pointer;flex:1" onclick="toggleDet('+idx+')">'
      +'<div><b style="font-size:.9rem;color:#e8eaf0">'+p.nome+'</b>'
      +'<div style="font-size:.7rem;color:#6b7899;margin-top:2px">'+jogosP+' palpites &middot; '+r.acertos+' acertos &middot; '+r.exatos+' exatos</div></div>'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:1.1rem;font-weight:900;color:#00a651">'+r.total+' pts</span>'
      +'<span style="color:#6b7899;font-size:.9rem">&darr;</span>'
      +'</div>'
      +'<button onclick="excluirParticipante('+idx+')" style="background:#c0392b;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:.75rem;font-weight:700;cursor:pointer;margin-left:8px;white-space:nowrap">&#128465; Excluir</button>'
      +'</div>'
      +'<div id="det'+idx+'" style="display:none;padding:8px 14px 14px">'
      +'<button onclick="copiarComp('+idx+')" style="background:#002776;color:#f5d400;border:none;border-radius:8px;padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;margin-bottom:10px">&#128203; Copiar Comprovante</button>'
      +linhasJogos(p,r)
      +'</div>'
      +'</div>';
  }
  html+='</div>';
  document.getElementById('tabPalpites').innerHTML=html;
}

function toggleDet(idx){
  var el=document.getElementById('det'+idx);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}
window.toggleDet=toggleDet;

function copiarComp(idx){
  var p=todosParticipantes[idx];
  if(!p) return;
  var pal=p.palpites||{};
  var txt='BOLAO COPA 2026\nParticipante: '+p.nome+'\n========================\n';
  var gkeys=Object.keys(G);
  for(var gi=0;gi<gkeys.length;gi++){
    var gl=gkeys[gi],info=G[gl];
    txt+='\nGRUPO '+gl+'\n';
    for(var ji=0;ji<info.jogos.length;ji++){
      var j=info.jogos[ji];
      var pp=pal['g'+j.id];
      var va=pp&&pp.a!=null?pp.a:'?';
      var vb=pp&&pp.b!=null?pp.b:'?';
      txt+='  #'+j.id+' '+j.t1+' '+va+'x'+vb+' '+j.t2+'\n';
    }
  }
  txt+='\n========================\nGerado: '+new Date().toLocaleString('pt-BR');
  navigator.clipboard.writeText(txt).then(function(){
    showToast('Comprovante copiado!');
  }).catch(function(){
    var w=window.open('');
    if(w) w.document.write('<pre style="font-size:13px;padding:20px">'+txt+'</pre>');
  });
}
window.copiarComp=copiarComp;

function linhasJogos(p,r){
  var pal=p.palpites||{};
  var html='';
  var gkeys=Object.keys(G);
  for(var gi=0;gi<gkeys.length;gi++){
    var gl=gkeys[gi],info=G[gl];
    html+='<div style="font-size:.68rem;font-weight:900;color:#f5d400;margin:8px 0 3px;letter-spacing:1px">GRUPO '+gl+'</div>';
    for(var ji=0;ji<info.jogos.length;ji++){
      var j=info.jogos[ji];
      var pp=pal['g'+j.id];
      var va=pp&&pp.a!=null?pp.a:'&mdash;';
      var vb=pp&&pp.b!=null?pp.b:'&mdash;';
      var res=resultadosOficiais['g'+j.id];
      var pts='';
      if(res&&res.a!=null&&pp&&pp.a!=null){
        var ra=+res.a,rb=+res.b,pa=+pp.a,pb=+pp.b;
        if(pa===ra&&pb===rb) pts='<span style="color:#00a651;font-weight:700">+10</span>';
        else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb)) pts='<span style="color:#e8601c;font-weight:700">+5</span>';
        else pts='<span style="color:#c0392b">0</span>';
      }
      html+='<div style="display:flex;align-items:center;padding:2px 0;border-bottom:1px solid #1e293b;font-size:.74rem">'
        +'<span style="color:#4a5a7a;width:22px">#'+j.id+'</span>'
        +'<span style="flex:1;color:#ccd">'+j.t1+'</span>'
        +'<span style="font-weight:900;color:#f5d400;margin:0 8px">'+va+' x '+vb+'</span>'
        +'<span style="flex:1;text-align:right;color:#ccd">'+j.t2+'</span>'
        +'<span style="width:28px;text-align:right">'+pts+'</span>'
        +'</div>';
    }
  }
  return html;
}

// ============================================================
// TABS
// ============================================================
window.showTab = function(tab){
  tabAtual=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  ['ranking','resultados','palpites'].forEach(function(t){
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).style.display=t===tab?'block':'none';
  });
  if(tab==='ranking') renderRanking();
  if(tab==='resultados') renderResultados();
  if(tab==='palpites') renderPalpites();
};

window.excluirParticipante = function(idx){
  var p=todosParticipantes[idx];
  if(!p) return;
  if(!confirm('Excluir participante "'+p.nome+'" e todos os seus palpites?')) return;
  var docId=p.nome.toLowerCase().replace(/\s+/g,'_');
  db.collection('palpites').doc(docId).delete().then(function(){
    showToast('&#128465; '+p.nome+' excluido!');
  }).catch(function(e){
    showToast('Erro ao excluir: '+e.message);
  });
};

function showToast(msg){
  var t=document.getElementById('toastEl');
  t.innerHTML=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(8px)';},2500);
}
</script>

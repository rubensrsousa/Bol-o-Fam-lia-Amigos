.modal h2{font-size:1rem;font-weight:900;color:#002776;margin-bottom:6px}

.modal button{width:100%;background:#00a651;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.92rem;font-weight:900;cursor:pointer}
.erro{color:#c0392b;font-size:.75rem;text-align:center;margin-top:6px}

.tab{flex:1;padding:13px 10px;text-align:center;font-size:.85rem;font-weight:700;cursor:pointer;color:#6b7899;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:#f5d400;border-bottom-color:#f5d400;background:#002776}

/* CONTEÚDO */
.tab-content{display:none;padding:12px;max-width:900px;margin:0 auto}
.tab-content.active{display:block}

.rank-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden;margin-bottom:12px}

.rank-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #f0f3f8;gap:8px}
.rank-row:last-child{border-bottom:none}
.rank-row.ativo{background:#fffbea}
.rpos{font-size:1.1rem;font-weight:900;width:28px;flex-shrink:0}

.rnome{flex:1;font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpts{font-size:1.1rem;font-weight:900;color:#00a651}

.sel-wrap label{font-size:.72rem;font-weight:700;color:#002776;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
select{width:100%;background:#f4f6fb;border:2px solid #dde2ef;border-radius:8px;padding:10px;font-size:.9rem;font-weight:700;color:#002776;outline:none}
select:focus{border-color:#00a651}

/* TABELA DE PALPITES — estrutura de grid por linha */
.pal-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden;margin-bottom:8px}

.fc-titulo{padding:7px 12px;color:#fff}
.fc-titulo.grupo{background:#002776;color:#f5d400}
.fc-titulo.seg{background:#1a6b3a}
.fc-titulo.oit{background:#15548a}
.fc-titulo.qua{background:#7a1a8b}
.fc-titulo.semi{background:#8b3a00}
.fc-titulo.fin{background:#8b0000}

.fc-res{padding:7px 4px;text-align:center;background:#1a3a6a;color:#f5d400}

.jogo-linha{display:grid;grid-template-columns:1fr 52px 52px;border-bottom:1px solid #f0f3f8;align-items:stretch}
.jogo-linha:last-child{border-bottom:none}

.jl-info{display:flex;align-items:center;gap:4px;padding:5px 10px;min-width:0}
.jl-num{font-size:.6rem;color:#9ab;font-weight:700;width:20px;flex-shrink:0}
.jl-t1{font-size:.73rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.jl-placar{font-size:.8rem;font-weight:900;color:#002776;background:#f4f6fb;border-radius:4px;padding:2px 5px;margin:0 3px;white-space:nowrap;flex-shrink:0}

.jl-t2{font-size:.73rem;font-weight:700;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.jl-pts{display:flex;align-items:center;justify-content:center;border-left:1px solid #f0f3f8;padding:4px}
.jl-res{display:flex;align-items:center;justify-content:center;border-left:1px solid #f0f3f8;padding:4px}

</style>

      var ra=+res.a,rb=+res.b,pa=+p.a,pb=+p.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb)){total+=5;acertos++;}
    });
    var jogosComRes=G[gl].jogos.filter(function(j){var r=resultadosOficiais['g'+j.id];return r&&r.a!=null;}).length;
    if(jogosComRes===6){
      var co=calcClassOficial(gl),cp=calcClassPart(gl,pal);
      if(co&&cp){if(co[0]&&cp[0]===co[0])total+=5;if(co[1]&&cp[1]===co[1])total+=5;}
    }
  }
  var fasesMM=[{jogos:SEG,bonus:5},{jogos:OIT,bonus:10},{jogos:QUA,bonus:15},{jogos:SEMI,bonus:20},{jogos:[TERC,FINAL],bonus:0}];
  fasesMM.forEach(function(fase){
    fase.jogos.forEach(function(j){
      var res=resultadosOficiais['mm'+j.id],p=pal['mm'+j.id];
      if(!res||res.a==null||!p||p.a==null||p.b==null)return;
      var ra=+res.a,rb=+res.b,pa=+p.a,pb=+p.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)){total+=5;acertos++;}
      if(fase.bonus>0&&res.v&&p.v===res.v)total+=fase.bonus;
    });
  });
  return{total:total,acertos:acertos,exatos:exatos};
}

function entrar(){
  var s=document.getElementById('senhaInput').value.trim();
  if(s===SENHA_VIS){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('mainWrap').style.display='block';
    iniciar();
  }else{document.getElementById('erroLogin').textContent='Senha incorreta.';}
}
function iniciar(){
  var app=firebase.initializeApp(FBCFG);
  db=firebase.firestore();
  db.collection('admin').doc('resultados').onSnapshot(function(snap){
    if(snap.exists)resultadosOficiais=snap.data().resultados||{};
    renderRanking();mostrarPalpites();renderJogos();
  });
  db.collection('palpites').onSnapshot(function(snap){
    participantes=[];
    snap.forEach(function(d){participantes.push(d.data());});
    participantes.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
    var sel=document.getElementById('selPart');
    var cur=sel.value;
    sel.innerHTML='<option value="">— Selecione —</option>';
    participantes.forEach(function(p,i){sel.innerHTML+='<option value="'+i+'"'+(i==cur?' selected':'')+'>'+p.nome+'</option>';});
    if(cur===''&&participantes.length>0){sel.value='0';}
    renderRanking();mostrarPalpites();renderJogos();
  });
}

function renderRanking(){
  var lista=participantes.map(function(p){
    var r=calcPontos(p.palpites||{});
    return{nome:p.nome,total:r.total,acertos:r.acertos,exatos:r.exatos};
  }).sort(function(a,b){return b.total-a.total||b.exatos-a.exatos||b.acertos-a.acertos;});

  var html='';
  lista.forEach(function(p,i){

function mostrarPalpites(){
  var idx=document.getElementById('selPart').value;
  if(idx===''){document.getElementById('palWrap').innerHTML='<div class="empty">Selecione um participante acima.</div>';return;}
  var p=participantes[idx];if(!p)return;
  var pal=p.palpites||{};
  var html='';var grandTotal=0;

  Object.keys(G).forEach(function(gl){
    var info=G[gl];
    html+='<div class="pal-card">'+faseHeader('grupo','&#9917; GRUPO '+gl);
    info.jogos.forEach(function(j){
      var pp=pal['g'+j.id],res=resultadosOficiais['g'+j.id];
      var temPal=pp&&pp.a!=null&&pp.b!=null;
      var placarPal=temPal?pp.a+'×'+pp.b:null;
      var ptCls=getPtJogo(res,pp);
      var ptVal=ptCls==='ex'?10:ptCls==='ok'?5:0;
      if(ptCls)grandTotal+=ptVal;
      var resStr=res&&res.a!=null?res.a+'×'+res.b:null;
      html+=jogoRow(j.id,j.t1,placarPal,j.t2,ptCls,ptVal,resStr);
    });
    html+='</div>';
  });

  var fases=[
    {cls:'seg',label:'Segundas de Final',jogos:SEG,bonus:5},
    {cls:'oit',label:'Oitavas de Final',jogos:OIT,bonus:10},
    {cls:'qua',label:'Quartas de Final',jogos:QUA,bonus:15},
    {cls:'semi',label:'Semifinais',jogos:SEMI,bonus:20},
    {cls:'fin',label:'3° Lugar e Final',jogos:[TERC,FINAL],bonus:0}
  ];
  fases.forEach(function(fase){
    html+='<div class="pal-card">'+faseHeader(fase.cls,fase.label);
    fase.jogos.forEach(function(j){
      var pp=pal['mm'+j.id],res=resultadosOficiais['mm'+j.id];
      var t1=pp&&pp.t1?pp.t1:resolveTime(j.t1,pal);
      var t2=pp&&pp.t2?pp.t2:resolveTime(j.t2,pal);
      var temPal=pp&&pp.a!=null&&pp.b!=null;
      var placarPal=temPal?pp.a+'×'+pp.b:null;
      var ptCls=getPtJogo(res,pp);
      var ptVal=0;
      if(ptCls==='ex')ptVal=10;
      else if(ptCls==='ok')ptVal=5;
      if(fase.bonus>0&&res&&res.v&&pp&&pp.v===res.v)ptVal+=fase.bonus;
      if(ptCls)grandTotal+=ptVal;
      var resStr=res&&res.a!=null?res.a+'×'+res.b:null;
      html+=jogoRow(j.id,t1,placarPal,t2,ptCls,ptVal,resStr);
    });
    html+='</div>';
  });

  html+='<div class="total-linha"><span>TOTAL DE PONTOS</span><span style="color:#00a651">'+grandTotal+' pts</span></div>';
  document.getElementById('palWrap').innerHTML=html;
}

function renderJogos(){
  var el=document.getElementById('jogosWrap');
  if(!el)return;
  var html='';

  // GRUPOS ordenados por data
  var todosJogosGrupo = [];
  Object.keys(G).forEach(function(gl){
    G[gl].jogos.forEach(function(j){
      var cal=CALENDARIO[j.id];
      todosJogosGrupo.push({id:j.id, t1:j.t1, t2:j.t2, dt:cal?cal.dt:new Date(0), rodada:cal?cal.rodada:''});
    });
  });
  todosJogosGrupo.sort(function(a,b){return a.dt-b.dt;});

  var curRodada='';
  todosJogosGrupo.forEach(function(j){
    if(j.rodada!==curRodada){
      curRodada=j.rodada;
      html+='<div class="fase-label">&#9917; '+curRodada.toUpperCase()+'</div>';
    }
    var res=resultadosOficiais['g'+j.id];
    var resStr=res&&res.a!=null?res.a+'×'+res.b:null;
    var dtStr=j.dt.getTime()>0?j.dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+' '+j.dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
    html+=jogoCard('g',j.id,j.t1,j.t2,resStr,dtStr);
  });

  // ELIMINATÓRIAS
  var fases=[
    {label:'SEGUNDAS DE FINAL',jogos:SEG,tipo:'mm'},
    {label:'OITAVAS DE FINAL',jogos:OIT,tipo:'mm'},
    {label:'QUARTAS DE FINAL',jogos:QUA,tipo:'mm'},
    {label:'SEMIFINAIS',jogos:SEMI,tipo:'mm'},
    {label:'3° LUGAR E FINAL',jogos:[TERC,FINAL],tipo:'mm'}
  ];
  fases.forEach(function(fase){
    html+='<div class="fase-label">'+fase.label+'</div>';
    fase.jogos.forEach(function(j){
      var res=resultadosOficiais['mm'+j.id];
      var resStr=res&&res.a!=null?res.a+'×'+res.b:null;
      var t1=j.t1&&j.t1.g?'1°/2° Gr.'+j.t1.g:(j.t1&&j.t1.s?'Venc.#'+j.t1.s:j.t1&&j.t1.o?'Venc.#'+j.t1.o:j.t1&&j.t1.q?'Venc.#'+j.t1.q:j.t1&&j.t1.sv?'Venc.#'+j.t1.sv:j.t1&&j.t1.sl?'Perd.#'+j.t1.sl:j.t1&&j.t1.tc?'3°#'+j.t1.tc:'?');
      var t2=j.t2&&j.t2.g?'1°/2° Gr.'+j.t2.g:(j.t2&&j.t2.s?'Venc.#'+j.t2.s:j.t2&&j.t2.o?'Venc.#'+j.t2.o:j.t2&&j.t2.q?'Venc.#'+j.t2.q:j.t2&&j.t2.sv?'Venc.#'+j.t2.sv:j.t2&&j.t2.sl?'Perd.#'+j.t2.sl:j.t2&&j.t2.tc?'3°#'+j.t2.tc:'?');
      if(participantes.length>0){
        var pal0=participantes[0].palpites||{};
        var pp=pal0['mm'+j.id];
        if(pp&&pp.t1)t1=pp.t1;
        if(pp&&pp.t2)t2=pp.t2;
      }
      html+=jogoCard('mm',j.id,t1,t2,resStr,'');
    });
  });

}

function jogoCard(tipo,id,t1,t2,resStr,dtStr){

      +'<span class="jogo-btn-num">#'+id+'</span>'
      +'<span class="jogo-btn-t1">'+t1+dtHtml+'</span>'
      +'<span class="jogo-btn-res'+(resStr?'':' vazio')+'">'+( resStr||'—')+'</span>'
      +'<span class="jogo-btn-t2">'+t2+'</span>'
      +'<span class="jogo-btn-arrow">▼</span>'
    +'</div>'
    +'<div class="jogo-detail" id="jdet_'+tipo+id+'"></div>'
    +'</div>';
}

window.toggleJogo = function(tipo,id){
  var btn=document.getElementById('jbtn_'+tipo+id);
  var det=document.getElementById('jdet_'+tipo+id);
  if(!btn||!det)return;
  var isOpen=btn.classList.contains('aberto');
  // Close all others
  document.querySelectorAll('.jogo-btn.aberto').forEach(function(b){
    b.classList.remove('aberto');
  });
  if(!isOpen){
    btn.classList.add('aberto');
    det.innerHTML=buildJogoDetail(tipo,id);
  }
};

function buildJogoDetail(tipo,id){
  var vitoria=[],empate=[],derrota=[];
  var res=resultadosOficiais[tipo+id];

  participantes.forEach(function(p){
    var pal=p.palpites||{};
    var pp=pal[tipo+id];
    if(!pp||pp.a==null||pp.b==null)return;
    var pa=+pp.a,pb=+pp.b;
    var entry={nome:p.nome,placar:pa+'×'+pb,a:pa,b:pb,pp:pp};
    if(pa>pb) vitoria.push(entry);
    else if(pa===pb) empate.push(entry);
    else derrota.push(entry);
  });

  // Sort each group by placar (higher first)
  function sortPlacar(arr){
    return arr.sort(function(a,b){return (b.a+b.b)-(a.a+a.b)||a.a-b.a;});
  }
  vitoria=sortPlacar(vitoria);
  empate=sortPlacar(empate);
  derrota=sortPlacar(derrota);

  function getPts(entry){
    if(!res||res.a==null)return null;
    var ra=+res.a,rb=+res.b,pa=entry.a,pb=entry.b;
    if(pa===ra&&pb===rb)return 'ex';
    if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb))return 'ok';
    return 'no';
  }

  function renderGroup(arr,label,cls){
    if(arr.length===0)return '';
    var html='<div class="jg-section-title '+cls+'">'+label+' ('+arr.length+')</div>';
    arr.forEach(function(e){
      var ptCls=getPts(e);
      var ptBadge='';
      if(ptCls==='ex')ptBadge='<span class="jg-part-pts ex">+10</span>';
      else if(ptCls==='ok')ptBadge='<span class="jg-part-pts ok">+5</span>';
      else if(ptCls==='no')ptBadge='<span class="jg-part-pts no">0</span>';
      html+='<div class="jg-part-row">'
        +'<span class="jg-part-nome">'+e.nome+'</span>'
        +'<span class="jg-part-placar">'+e.placar+'</span>'
        +ptBadge
        +'</div>';
    });
    return html;
  }

  var t1='Time 1',t2='Time 2';
  var jinfo=findJogoInfo(tipo,id);
  if(jinfo){t1=jinfo.t1;t2=jinfo.t2;}

  var html='';
  html+=renderGroup(vitoria,'&#9989; '+t1+' vence','vitoria');
  html+=renderGroup(empate,'&#129492; Empate','empate');
  html+=renderGroup(derrota,'&#9989; '+t2+' vence','derrota');

  var semPalpite=participantes.filter(function(p){
    var pp=(p.palpites||{})[tipo+id];
    return !pp||pp.a==null||pp.b==null;
  });
  if(semPalpite.length>0){
    html+='<div class="jg-section-title">Sem palpite ('+semPalpite.length+')</div>';
    semPalpite.forEach(function(p){
      html+='<div class="jg-part-row"><span class="jg-part-nome" style="color:#ccc">'+p.nome+'</span><span style="color:#ccc;font-size:.72rem">—</span></div>';
    });
  }

  return html||'<div class="empty">Nenhum palpite ainda.</div>';
}

function findJogoInfo(tipo,id){
  if(tipo==='g'){
    for(var gl in G){
      for(var i=0;i<G[gl].jogos.length;i++){
        if(G[gl].jogos[i].id===id)return G[gl].jogos[i];
      }
    }
  }
  return null;
}

window.entrar=entrar;
window.mostrarPalpites=mostrarPalpites;
window.showTab=showTab;
</script>

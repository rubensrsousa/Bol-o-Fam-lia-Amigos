<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,Helvetica,sans-serif;background:#eef0f5;color:#111;min-height:100vh;font-size:14px}
.hd{background:linear-gradient(140deg,#002776 0%,#003ab2 55%,#007a3d 100%);padding:14px}
.hd h1{font-size:1.5rem;font-weight:900;color:#f5d400;letter-spacing:2px;line-height:1.1}
.hd p{font-size:.72rem;color:rgba(255,255,255,.7);margin-top:2px}
.nome-row{display:flex;align-items:center;gap:8px;margin-top:11px}
.nome-row b{font-size:.78rem;color:rgba(255,255,255,.85);white-space:nowrap}
.nome-in{flex:1;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;font-size:.95rem;font-weight:700;padding:7px 10px;outline:none}
.nome-in::placeholder{color:rgba(255,255,255,.38)}
.nome-in:focus{border-color:#f5d400}
.regras{background:#001a5e;display:flex;overflow-x:auto;scrollbar-width:none}
.regras::-webkit-scrollbar{display:none}
.ri{display:flex;align-items:center;gap:5px;padding:7px 11px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.1)}
.rb{border-radius:4px;padding:1px 6px;font-weight:700;font-size:.75rem;color:#fff}
.rb.e{background:#b8a000;color:#002776}.rb.v{background:#00a651}.rb.b{background:#e8601c}.rb.m{background:#555}
.rt{color:rgba(255,255,255,.72);font-size:.7rem}
.prog-wrap{background:#fff;padding:8px 13px;border-bottom:1px solid #dde2ef}
.prog-top{display:flex;justify-content:space-between;font-size:.68rem;color:#6b7899;font-weight:700;margin-bottom:4px}
.prog-track{height:5px;background:#e0e5f0;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#007a3d,#00a651);border-radius:99px;width:0%;transition:width .3s}
.sh{display:flex;align-items:center;gap:8px;padding:13px 12px 5px}
.sh h2{font-size:.88rem;font-weight:900;color:#002776;text-transform:uppercase;letter-spacing:1.5px}
.sh .sb{border-radius:4px;padding:1px 7px;font-size:.72rem;font-weight:700;color:#fff;background:#002776}
.gc{background:#fff;border-radius:10px;margin:0 10px 8px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.gh{background:#002776;color:#f5d400;font-size:.82rem;font-weight:900;padding:6px 11px;display:flex;justify-content:space-between;align-items:center;letter-spacing:1.5px}
.ghsub{color:rgba(255,255,255,.5);font-size:.62rem;font-weight:400;letter-spacing:0}
.jr{display:grid;grid-template-columns:22px 1fr 34px 12px 34px 1fr;align-items:center;gap:3px;padding:5px 9px;border-bottom:1px solid #f0f3f8}
.jr:last-child{border-bottom:none}
.jn{font-size:.6rem;color:#9ab;font-weight:700;text-align:center}
.tn{font-size:.74rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnr{text-align:right}
.vs{text-align:center;font-size:.6rem;color:#bbb;font-weight:700}
.pi{width:34px;height:30px;background:#f2f4fa;border:2px solid #d8deef;border-radius:7px;text-align:center;font-size:1.1rem;font-weight:900;color:#002776;outline:none;-moz-appearance:textfield}
.pi::-webkit-outer-spin-button,.pi::-webkit-inner-spin-button{-webkit-appearance:none}
.pi:focus{border-color:#00a651;background:#edfbf3;color:#007a3d;box-shadow:0 0 0 3px rgba(0,166,81,.1)}
.pi.ok{border-color:#a8d8bc;background:#edfbf3}
/* CLASSIFICADOS */
.clw{background:#fff;border-radius:10px;margin:0 10px 8px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.clh{background:#e8601c;color:#fff;font-size:.82rem;font-weight:900;padding:6px 11px;letter-spacing:1.5px}
.clh p{font-size:.65rem;font-weight:400;color:rgba(255,255,255,.75);margin-top:1px;letter-spacing:0}
.clgrid{display:grid;grid-template-columns:repeat(2,1fr)}
.cli{padding:6px 10px;border-right:1px solid #eee;border-bottom:1px solid #eee}
.cli:nth-child(even){border-right:none}
.clgl{font-size:.62rem;font-weight:900;color:#002776;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.clpos{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.clb{font-size:.6rem;font-weight:900;color:#fff;border-radius:3px;padding:1px 4px;min-width:15px;text-align:center}
.clb.p1{background:#b8860b}.clb.p2{background:#7a8aaa}.clb.p3{background:#a04030}
.clt{font-size:.76rem;font-weight:700}
.clt.ok{color:#007a3d}.clt.nd{color:#ccd;font-style:italic;font-size:.68rem;font-weight:400}
/* TERCEIROS */
.tcw{background:#fff;border-radius:10px;margin:0 10px 8px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.tch{background:#8b1a8b;color:#fff;font-size:.82rem;font-weight:900;padding:6px 11px;letter-spacing:1.5px}
.tch p{font-size:.65rem;font-weight:400;color:rgba(255,255,255,.75);margin-top:1px;letter-spacing:0}
.tcgrid{display:grid;grid-template-columns:repeat(2,1fr)}
.tci{padding:6px 10px;border-right:1px solid #eee;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px}
.tci:nth-child(even){border-right:none}
.tci-pos{font-size:.62rem;font-weight:900;color:#8b1a8b;min-width:18px}
.tci-nome{font-size:.74rem;font-weight:700}
.tci-nome.ok{color:#007a3d}.tci-nome.nd{color:#ccd;font-style:italic;font-size:.68rem;font-weight:400}
.tci-pts{font-size:.6rem;color:#888;margin-left:auto}
/* SEGUNDAS */
.segw{background:#fff;border-radius:10px;margin:0 10px 8px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.segh{background:#007a3d;color:#fff;font-size:.82rem;font-weight:900;padding:6px 11px;letter-spacing:1.5px}
.segh p{font-size:.65rem;font-weight:400;color:rgba(255,255,255,.75);margin-top:1px;letter-spacing:0}
.segr{display:grid;grid-template-columns:22px 1fr 31px 12px 31px 1fr;align-items:center;gap:3px;padding:5px 9px;border-bottom:1px solid #f0f3f8}
.segr:last-child{border-bottom:none}
.stn{font-size:.73rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stn.auto{color:#007a3d}.stn.nd{color:#ccd;font-style:italic;font-size:.67rem;font-weight:400}.stn.r{text-align:right}
.spi{width:31px;height:28px;background:#f2f4fa;border:2px solid #d8deef;border-radius:6px;text-align:center;font-size:1rem;font-weight:900;color:#002776;outline:none;-moz-appearance:textfield}
.spi::-webkit-outer-spin-button,.spi::-webkit-inner-spin-button{-webkit-appearance:none}
.spi:focus{border-color:#00a651;background:#edfbf3}
.spi.ok{border-color:#a8d8bc;background:#edfbf3}
.spi:disabled{opacity:.28;cursor:not-allowed}
.sv{position:sticky;bottom:0;background:#fff;border-top:1px solid #dde2ef;padding:11px 13px;display:flex;gap:8px}
.btns{flex:1;background:#00a651;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.9rem;font-weight:900;cursor:pointer}
.btns:active{background:#007a3d}
.btni{background:#002776;color:#f5d400;border:none;border-radius:10px;padding:12px 14px;font-size:.82rem;font-weight:900;cursor:pointer}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(8px);background:#002776;color:#fff;padding:8px 16px;border-radius:18px;font-weight:700;font-size:.78rem;opacity:0;transition:all .22s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:360px){
  .jr{grid-template-columns:18px 1fr 30px 10px 30px 1fr;gap:2px}
  .pi{width:30px;height:28px;font-size:1rem}
  .tn{font-size:.68rem}
  .segr{grid-template-columns:18px 1fr 28px 10px 28px 1fr}
  .spi{width:28px}
}
</style>
</head>
<body>
<div class="hd">
  <h1>&#127942; Bolão Copa 2026</h1>
  <p>EUA · Canadá · México &nbsp;|&nbsp; Fase de Grupos + Segundas de Final</p>
  <div class="nome-row">
    <b>&#128100;</b>
    <input class="nome-in" id="nomeP" type="text" placeholder="Seu nome aqui..." maxlength="30">
  </div>
</div>
<div class="regras">
  <div class="ri"><span class="rb e">+10</span><span class="rt">Placar exato</span></div>
  <div class="ri"><span class="rb v">+5</span><span class="rt">Resultado certo</span></div>
  <div class="ri"><span class="rb b">+5</span><span class="rt">1°/2° do grupo</span></div>
  <div class="ri"><span class="rb m">&#215;2/&#215;3</span><span class="rt">Oitavas/Semi</span></div>
</div>
<div class="prog-wrap">
  <div class="prog-top"><span>Progresso</span><span id="progTxt">0 / 72 jogos</span></div>
  <div class="prog-track"><div class="prog-fill" id="progBar"></div></div>
</div>
<div id="app"></div>
<div class="sv">
  <button class="btns" onclick="showToast('&#x2705; Palpites registrados!')">&#128190; Salvar</button>
  <button class="btni" onclick="window.print()">&#128424;</button>
</div>
<div class="toast" id="toastEl"></div>
<script>
// ============================================================
// DADOS DOS GRUPOS
// ============================================================
var G={
  A:{times:['México','África do Sul','Coreia do Sul','Rep. Tcheca'],
     jogos:[{id:1,t1:'México',t2:'África do Sul'},{id:2,t1:'Coreia do Sul',t2:'Rep. Tcheca'},{id:3,t1:'Coreia do Sul',t2:'México'},{id:4,t1:'Coreia do Sul',t2:'África do Sul'},{id:5,t1:'México',t2:'Rep. Tcheca'},{id:6,t1:'Rep. Tcheca',t2:'África do Sul'}]},
  B:{times:['Canadá','Bósnia','Catar','Suíça'],
     jogos:[{id:7,t1:'Canadá',t2:'Bósnia'},{id:8,t1:'Catar',t2:'Suíça'},{id:9,t1:'Bósnia',t2:'Catar'},{id:10,t1:'Bósnia',t2:'Suíça'},{id:11,t1:'Canadá',t2:'Catar'},{id:12,t1:'Canadá',t2:'Suíça'}]},
  C:{times:['Brasil','Marrocos','Haiti','Escócia'],
     jogos:[{id:13,t1:'Brasil',t2:'Marrocos'},{id:14,t1:'Haiti',t2:'Escócia'},{id:15,t1:'Brasil',t2:'Escócia'},{id:16,t1:'Brasil',t2:'Haiti'},{id:17,t1:'Escócia',t2:'Marrocos'},{id:18,t1:'Haiti',t2:'Marrocos'}]},
  D:{times:['EUA','Paraguai','Austrália','Turquia'],
     jogos:[{id:19,t1:'EUA',t2:'Paraguai'},{id:20,t1:'Austrália',t2:'Turquia'},{id:21,t1:'Austrália',t2:'EUA'},{id:22,t1:'Austrália',t2:'Paraguai'},{id:23,t1:'EUA',t2:'Turquia'},{id:24,t1:'Paraguai',t2:'Turquia'}]},
  E:{times:['Alemanha','Curaçao','C. Marfim','Equador'],
     jogos:[{id:25,t1:'Alemanha',t2:'Curaçao'},{id:26,t1:'C. Marfim',t2:'Equador'},{id:27,t1:'Alemanha',t2:'C. Marfim'},{id:28,t1:'Alemanha',t2:'Equador'},{id:29,t1:'C. Marfim',t2:'Curaçao'},{id:30,t1:'Curaçao',t2:'Equador'}]},
  F:{times:['Holanda','Japão','Suécia','Tunísia'],
     jogos:[{id:31,t1:'Holanda',t2:'Japão'},{id:32,t1:'Suécia',t2:'Tunísia'},{id:33,t1:'Holanda',t2:'Suécia'},{id:34,t1:'Holanda',t2:'Tunísia'},{id:35,t1:'Japão',t2:'Suécia'},{id:36,t1:'Japão',t2:'Tunísia'}]},
  G:{times:['Bélgica','Egito','Irã','N. Zelândia'],
     jogos:[{id:37,t1:'Bélgica',t2:'Egito'},{id:38,t1:'Irã',t2:'N. Zelândia'},{id:39,t1:'Bélgica',t2:'Irã'},{id:40,t1:'Bélgica',t2:'N. Zelândia'},{id:41,t1:'Egito',t2:'Irã'},{id:42,t1:'Egito',t2:'N. Zelândia'}]},
  H:{times:['Espanha','Cabo Verde','Ar. Saudita','Uruguai'],
     jogos:[{id:43,t1:'Espanha',t2:'Cabo Verde'},{id:44,t1:'Ar. Saudita',t2:'Uruguai'},{id:45,t1:'Ar. Saudita',t2:'Cabo Verde'},{id:46,t1:'Ar. Saudita',t2:'Espanha'},{id:47,t1:'Cabo Verde',t2:'Uruguai'},{id:48,t1:'Espanha',t2:'Uruguai'}]},
  I:{times:['França','Senegal','Iraque','Noruega'],
     jogos:[{id:49,t1:'França',t2:'Senegal'},{id:50,t1:'Iraque',t2:'Noruega'},{id:51,t1:'França',t2:'Iraque'},{id:52,t1:'França',t2:'Noruega'},{id:53,t1:'Iraque',t2:'Senegal'},{id:54,t1:'Noruega',t2:'Senegal'}]},
  J:{times:['Argentina','Argélia','Áustria','Jordânia'],
     jogos:[{id:55,t1:'Argentina',t2:'Argélia'},{id:56,t1:'Áustria',t2:'Jordânia'},{id:57,t1:'Argentina',t2:'Jordânia'},{id:58,t1:'Argentina',t2:'Áustria'},{id:59,t1:'Argélia',t2:'Jordânia'},{id:60,t1:'Argélia',t2:'Áustria'}]},
  K:{times:['Portugal','RD Congo','Uzbequistão','Colômbia'],
     jogos:[{id:61,t1:'Portugal',t2:'RD Congo'},{id:62,t1:'Uzbequistão',t2:'Colômbia'},{id:63,t1:'Colômbia',t2:'Portugal'},{id:64,t1:'Colômbia',t2:'RD Congo'},{id:65,t1:'Portugal',t2:'Uzbequistão'},{id:66,t1:'RD Congo',t2:'Uzbequistão'}]},
  L:{times:['Inglaterra','Croácia','Gana','Panamá'],
     jogos:[{id:67,t1:'Inglaterra',t2:'Croácia'},{id:68,t1:'Gana',t2:'Panamá'},{id:69,t1:'Croácia',t2:'Gana'},{id:70,t1:'Croácia',t2:'Inglaterra'},{id:71,t1:'Gana',t2:'Panamá'},{id:72,t1:'Inglaterra',t2:'Panamá'}]}
};

// Cruzamentos das Segundas de Final
// ref: {g:'A',p:1} = 1° do Grupo A | {tc:N} = N-ésimo melhor 3° colocado
var SEG=[
  {id:73,t1:{g:'A',p:2},t2:{g:'B',p:2}},
  {id:74,t1:{g:'E',p:1},t2:{tc:1}},   // 3° ABCDF
  {id:75,t1:{g:'F',p:1},t2:{g:'C',p:2}},
  {id:76,t1:{g:'C',p:1},t2:{g:'F',p:2}},
  {id:77,t1:{g:'I',p:1},t2:{tc:2}},   // 3° CDFGH
  {id:78,t1:{g:'E',p:2},t2:{g:'I',p:2}},
  {id:79,t1:{g:'A',p:1},t2:{tc:3}},   // 3° CEFHI
  {id:80,t1:{g:'L',p:1},t2:{tc:4}},   // 3° EHIJK
  {id:81,t1:{g:'D',p:1},t2:{tc:5}},   // 3° BEFIJ
  {id:82,t1:{g:'G',p:1},t2:{tc:6}},   // 3° AEHIJ
  {id:83,t1:{g:'K',p:2},t2:{g:'L',p:2}},
  {id:84,t1:{g:'H',p:1},t2:{g:'J',p:2}},
  {id:85,t1:{g:'B',p:1},t2:{tc:7}},   // 3° EFGIJ
  {id:86,t1:{g:'J',p:1},t2:{g:'H',p:2}},
  {id:87,t1:{g:'K',p:1},t2:{tc:8}},   // 3° DEIJL
  {id:88,t1:{g:'D',p:2},t2:{g:'G',p:2}}
];

// Labels dos grupos de origem de cada vaga de 3° colocado
var TC_LABEL=['ABCDF','CDFGH','CEFHI','EHIJK','BEFIJ','AEHIJ','EFGIJ','DEIJL'];

// ============================================================
// ESTADO
// ============================================================
var P={};   // palpites grupos  {id:{a,b}}
var PS={};  // palpites segundas {id:{a,b}}

// ============================================================
// CÁLCULO CLASSIFICAÇÃO DE UM GRUPO
// ============================================================
function classificar(gl){
  var info=G[gl], pts={},sg={},gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  info.jogos.forEach(function(j){
    var p=P[j.id]; if(!p||p.a==null||p.b==null) return;
    var a=+p.a,b=+p.b; if(isNaN(a)||isNaN(b)) return;
    gp[j.t1]+=a; gp[j.t2]+=b;
    sg[j.t1]+=(a-b); sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]+=1;pts[j.t2]+=1;}
  });
  return info.times.slice().sort(function(a,b){
    if(pts[b]!==pts[a]) return pts[b]-pts[a];
    if(sg[b]!==sg[a]) return sg[b]-sg[a];
    return gp[b]-gp[a];
  }).map(function(t){return {nome:t,pts:pts[t],sg:sg[t],gp:gp[t]};});
}

function temPalpite(gl){
  return G[gl].jogos.some(function(j){var p=P[j.id];return p&&p.a!=null&&p.b!=null;});
}

// ============================================================
// CÁLCULO DOS 8 MELHORES TERCEIROS
// ============================================================
// Retorna array de 8 posições [{nome, grupo, pts, sg, gp}] ordenados do melhor ao pior
// Se algum grupo não tiver palpites suficientes, usa {nome:null}
function calcTerceiros(){
  var lista=[];
  Object.keys(G).forEach(function(gl){
    var r=classificar(gl);
    var tem=temPalpite(gl);
    lista.push({
      nome: tem ? r[2].nome : null,
      grupo: gl,
      pts: r[2].pts,
      sg: r[2].sg,
      gp: r[2].gp,
      tem: tem
    });
  });
  // Ordena: pts desc → sg desc → gp desc
  lista.sort(function(a,b){
    if(!a.tem && !b.tem) return 0;
    if(!a.tem) return 1;
    if(!b.tem) return -1;
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.sg!==a.sg) return b.sg-a.sg;
    return b.gp-a.gp;
  });
  return lista; // lista[0]=melhor 3°, lista[7]=8° melhor, lista[8..11]=eliminados
}

// Resolve uma referência de time para as Segundas de Final
function resolveRef(ref){
  if(ref.g){
    // é 1° ou 2° de grupo
    if(!temPalpite(ref.g)) return {nome:null,auto:false};
    var r=classificar(ref.g);
    return {nome:r[ref.p-1].nome,auto:true};
  }
  if(ref.tc){
    // é um terceiro colocado (1-indexado)
    var tc=calcTerceiros();
    var item=tc[ref.tc-1];
    if(!item||!item.nome) return {nome:null,auto:false};
    return {nome:item.nome+' (3°'+item.grupo+')',auto:true};
  }
  return {nome:null,auto:false};
}

// ============================================================
// RENDER COMPLETO (só na inicialização)
// ============================================================
function render(){
  var html='';
  // ---- GRUPOS ----
  html+='<div class="sh"><h2>Fase de Grupos</h2><span class="sb">&#215;1 pts</span></div>';
  var gkeys=Object.keys(G);
  for(var gi=0;gi<gkeys.length;gi++){
    var gl=gkeys[gi], info=G[gl];
    html+='<div class="gc">'
      +'<div class="gh">&#9917; GRUPO '+gl+'<span class="ghsub">Exato=10pts &middot; Resultado=5pts</span></div>';
    for(var ji=0;ji<info.jogos.length;ji++){
      var j=info.jogos[ji];
      var p=P[j.id]||{};
      var va=p.a!=null?p.a:'', vb=p.b!=null?p.b:'';
      html+='<div class="jr">'
        +'<span class="jn">#'+j.id+'</span>'
        +'<span class="tn">'+j.t1+'</span>'
        +'<input class="pi'+(va!==''?' ok':'')+'" type="number" inputmode="numeric" min="0" max="20" id="g'+j.id+'a" value="'+(va!==''?va:'')+'" placeholder="-" oninput="upd('+j.id+',\'a\',this.value)">'
        +'<span class="vs">&#215;</span>'
        +'<input class="pi'+(vb!==''?' ok':'')+'" type="number" inputmode="numeric" min="0" max="20" id="g'+j.id+'b" value="'+(vb!==''?vb:'')+'" placeholder="-" oninput="upd('+j.id+',\'b\',this.value)">'
        +'<span class="tn tnr">'+j.t2+'</span>'
        +'</div>';
    }
    html+='</div>';
  }
  // ---- CLASSIFICADOS ----
  html+='<div class="sh"><h2>Classificados</h2><span class="sb" style="background:#e8601c">+5 pts</span></div>';
  html+='<div class="clw"><div class="clh">1°, 2° e 3° de cada grupo<p>Calculado automaticamente pelos seus palpites acima &#8593;</p></div><div class="clgrid" id="clGrid"></div></div>';
  // ---- MELHORES TERCEIROS ----
  html+='<div class="sh"><h2>Melhores 3° Colocados</h2><span class="sb" style="background:#8b1a8b">8 vagas</span></div>';
  html+='<div class="tcw"><div class="tch">Os 8 melhores 3° classificam para as Segundas de Final<p>Critério: Pontos &rarr; Saldo de Gols &rarr; Gols Pró</p></div><div class="tcgrid" id="tcGrid"></div></div>';
  // ---- SEGUNDAS ----
  html+='<div class="sh"><h2>Segundas de Final</h2><span class="sb" style="background:#007a3d">&#215;1 pts</span></div>';
  html+='<div class="segw"><div class="segh">16 confrontos do mata-mata<p>Times preenchidos automaticamente pelos seus palpites &#8593;</p></div><div id="segGrid"></div></div>';
  html+='<div style="height:14px"></div>';
  document.getElementById('app').innerHTML=html;
  updClassificados();
  updTerceiros();
  updSegundas();
  updProg();
}

// ============================================================
// ATUALIZAÇÕES PARCIAIS
// ============================================================
function updClassificados(){
  var el=document.getElementById('clGrid'); if(!el) return;
  var html='';
  var gkeys=Object.keys(G);
  for(var i=0;i<gkeys.length;i++){
    var gl=gkeys[i], tem=temPalpite(gl);
    var r=tem?classificar(gl):G[gl].times.map(function(t){return{nome:t};});
    html+='<div class="cli">'
      +'<div class="clgl">GRUPO '+gl+'</div>'
      +'<div class="clpos"><span class="clb p1">1°</span><span class="clt'+(tem?' ok':' nd')+'">'+r[0].nome+'</span></div>'
      +'<div class="clpos"><span class="clb p2">2°</span><span class="clt'+(tem?' ok':' nd')+'">'+r[1].nome+'</span></div>'
      +'<div class="clpos"><span class="clb p3">3°</span><span class="clt'+(tem?' ok':' nd')+'">'+r[2].nome+'</span></div>'
      +'</div>';
  }
  el.innerHTML=html;
}

function updTerceiros(){
  var el=document.getElementById('tcGrid'); if(!el) return;
  var tc=calcTerceiros();
  var html='';
  for(var i=0;i<12;i++){
    var item=tc[i];
    var classificado=i<8;
    var cor=classificado?'ok':'nd';
    var pos=(i+1)+'°';
    var ptsTxt=item.tem?('('+item.pts+'pts '+item.sg+' SG)'):'';
    var badge=classificado?'&#9989;':'&#10060;';
    html+='<div class="tci">'
      +'<span class="tci-pos">'+pos+'</span>'
      +'<span class="tci-nome'+(item.tem?' '+cor:' nd')+'">'+badge+' '+(item.nome||'?'+(item.grupo?' (Gr.'+item.grupo+')':''))+'</span>'
      +'<span class="tci-pts">'+ptsTxt+'</span>'
      +'</div>';
  }
  el.innerHTML=html;
}

function updSegundas(){
  var el=document.getElementById('segGrid'); if(!el) return;
  var html='';
  for(var i=0;i<SEG.length;i++){
    var s=SEG[i];
    var r1=resolveRef(s.t1), r2=resolveRef(s.t2);
    var n1=r1.nome, n2=r2.nome;
    var c1='stn'+(r1.auto?' auto':n1?'':' nd');
    var c2='stn r'+(r2.auto?' auto':n2?'':' nd');
    var lbl1=n1?n1:'?', lbl2=n2?n2:'?';
    var ps=PS[s.id]||{};
    var va=ps.a!=null?ps.a:'', vb=ps.b!=null?ps.b:'';
    var dis=(n1||n2)?'':' disabled';
    html+='<div class="segr">'
      +'<span class="jn">#'+s.id+'</span>'
      +'<span class="'+c1+'" title="'+lbl1+'">'+lbl1+'</span>'
      +'<input class="spi'+(va!==''?' ok':'')+'"'+dis+' type="number" inputmode="numeric" min="0" max="20" id="s'+s.id+'a" value="'+(va!==''?va:'')+'" placeholder="-" oninput="updSeg('+s.id+',\'a\',this.value)">'
      +'<span class="vs">&#215;</span>'
      +'<input class="spi'+(vb!==''?' ok':'')+'"'+dis+' type="number" inputmode="numeric" min="0" max="20" id="s'+s.id+'b" value="'+(vb!==''?vb:'')+'" placeholder="-" oninput="updSeg('+s.id+',\'b\',this.value)">'
      +'<span class="'+c2+'" title="'+lbl2+'">'+lbl2+'</span>'
      +'</div>';
  }
  el.innerHTML=html;
}

function updProg(){
  var tot=72, ok=0;
  var kids=Object.keys(P);
  for(var i=0;i<kids.length;i++){var p=P[kids[i]];if(p&&p.a!=null&&p.b!=null)ok++;}
  document.getElementById('progTxt').textContent=ok+' / '+tot+' jogos';
  document.getElementById('progBar').style.width=((ok/tot)*100)+'%';
}

// ============================================================
// HANDLERS
// ============================================================
function upd(id,side,val){
  val=val.replace(/[^0-9]/g,'').substring(0,2);
  var el=document.getElementById('g'+id+side);
  if(el) el.value=val;
  if(!P[id]) P[id]={a:null,b:null};
  P[id][side]=val!==''?parseInt(val):null;
  if(el){if(val!=='')el.classList.add('ok');else el.classList.remove('ok');}
  updClassificados();
  updTerceiros();
  updSegundas();
  updProg();
}

function updSeg(id,side,val){
  val=val.replace(/[^0-9]/g,'').substring(0,2);
  var el=document.getElementById('s'+id+side);
  if(el) el.value=val;
  if(!PS[id]) PS[id]={a:null,b:null};
  PS[id][side]=val!==''?parseInt(val):null;
  if(el){if(val!=='')el.classList.add('ok');else el.classList.remove('ok');}
}

function showToast(msg){
  var t=document.getElementById('toastEl');
  t.innerHTML=msg; t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},2200);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>

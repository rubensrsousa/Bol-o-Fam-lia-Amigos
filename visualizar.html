<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef0f5;color:#111;min-height:100vh}
.hd{background:linear-gradient(140deg,#002776 0%,#003ab2 55%,#007a3d 100%);padding:14px;text-align:center}
.hd h1{font-size:1.4rem;font-weight:900;color:#f5d400;letter-spacing:2px}
.hd p{font-size:.72rem;color:rgba(255,255,255,.65);margin-top:3px}

/* LOGIN */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:24px;margin:20px;max-width:320px;width:100%}
.modal h2{font-size:1rem;font-weight:900;color:#002776;margin-bottom:6px}
.modal p{font-size:.8rem;color:#555;margin-bottom:14px}

.modal input:focus{border-color:#00a651}
.modal button{width:100%;background:#00a651;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.92rem;font-weight:900;cursor:pointer}
.erro{color:#c0392b;font-size:.75rem;text-align:center;margin-top:6px}

/* LAYOUT */
.page{display:flex;gap:12px;padding:12px;max-width:1200px;margin:0 auto;align-items:flex-start}
.col-rank{width:220px;flex-shrink:0;position:sticky;top:10px}
.col-main{flex:1;min-width:0}

/* RANKING */
.rank-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.card-head{padding:8px 12px;font-weight:900;font-size:.78rem;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.card-head.azul{background:#002776;color:#f5d400}
.card-head.verde{background:#007a3d;color:#fff}
.rank-row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #f0f3f8;gap:6px}
.rank-row:last-child{border-bottom:none}
.rank-row.ativo{background:#fffbea}
.rpos{font-size:1rem;font-weight:900;width:24px;flex-shrink:0}
.rpos.p1{color:#b8860b}.rpos.p2{color:#7a8aaa}.rpos.p3{color:#a06030}
.rnome{flex:1;font-size:.75rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpts{font-size:.92rem;font-weight:900;color:#00a651}

/* SELETOR */
.sel-wrap{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,39,118,.08)}
.sel-wrap label{font-size:.72rem;font-weight:700;color:#002776;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
select{width:100%;background:#f4f6fb;border:2px solid #dde2ef;border-radius:8px;padding:9px;font-size:.88rem;font-weight:700;color:#002776;outline:none}
select:focus{border-color:#00a651}

/* TABELA DE PALPITES */
.pal-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden;margin-bottom:10px}
.fase-head{display:grid;grid-template-columns:1fr 80px 50px 50px;gap:0;font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.fase-head .fh-title{padding:7px 12px;color:#fff}
.fase-head .fh-pts{padding:7px 6px;text-align:center;background:#007a3d;color:#fff}
.fase-head .fh-res{padding:7px 6px;text-align:center;background:#002776;color:#f5d400}
.fase-head.grupo .fh-title{background:#002776;color:#f5d400}
.fase-head.seg .fh-title{background:#1a6b3a}
.fase-head.oit .fh-title{background:#15548a}
.fase-head.qua .fh-title{background:#7a1a8b}
.fase-head.semi .fh-title{background:#8b3a00}
.fase-head.final .fh-title{background:#8b0000}

.jogo-linha{display:grid;grid-template-columns:1fr 80px 50px 50px;gap:0;border-bottom:1px solid #f0f3f8;align-items:center}
.jogo-linha:last-child{border-bottom:none}
.jl-jogo{display:flex;align-items:center;gap:4px;padding:5px 10px}
.jl-num{font-size:.6rem;color:#9ab;font-weight:700;width:20px;flex-shrink:0}
.jl-t1{font-size:.74rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl-placar{font-size:.82rem;font-weight:900;color:#002776;background:#f4f6fb;border-radius:5px;padding:2px 5px;margin:0 4px;white-space:nowrap;flex-shrink:0}
.jl-placar.vazio{background:transparent;color:#ccc}
.jl-t2{font-size:.74rem;font-weight:700;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl-pts{text-align:center;padding:5px 4px;border-left:1px solid #f0f3f8}
.jl-res{text-align:center;padding:5px 4px;border-left:1px solid #f0f3f8}
.badge{display:inline-block;border-radius:4px;padding:1px 6px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge.ex{background:#007a3d;color:#fff}
.badge.ok{background:#e8601c;color:#fff}
.badge.no{background:#eee;color:#aaa}
.badge.vz{color:#ddd;font-size:.65rem}
.badge.res{background:#f4f6fb;color:#002776;font-weight:900}

.total-row{display:flex;justify-content:space-between;padding:8px 12px;background:#f8f9fc;border-top:2px solid #dde2ef;font-weight:900;font-size:.85rem;color:#002776}

.empty{text-align:center;padding:30px;color:#9ab;font-size:.82rem}

@media(max-width:700px){
  .page{flex-direction:column}
  .col-rank{width:100%;position:static}
  .fase-head .fh-pts,.fase-head .fh-res{display:none}
  .jl-pts,.jl-res{display:none}
  .jogo-linha,.fase-head{grid-template-columns:1fr 80px}
}
</style>

// ---- CLASSIFICAÇÃO ----
function calcClassPart(gl,pal){
  var info=G[gl],pts={},sg={},gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  var tem=false;
  info.jogos.forEach(function(j){
    var p=pal['g'+j.id];if(!p||p.a==null||p.b==null)return;
    tem=true;var a=+p.a,b=+p.b;
    gp[j.t1]+=a;gp[j.t2]+=b;sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]++;pts[j.t2]++;}
  });
  if(!tem)return null;
  return info.times.slice().sort(function(a,b){return pts[b]-pts[a]||sg[b]-sg[a]||gp[b]-gp[a];});
}
function calcClassOficial(gl){
  var info=G[gl],pts={},sg={},gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  var tem=false;
  info.jogos.forEach(function(j){
    var r=resultadosOficiais['g'+j.id];if(!r||r.a==null)return;
    tem=true;var a=+r.a,b=+r.b;
    gp[j.t1]+=a;gp[j.t2]+=b;sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]++;pts[j.t2]++;}
  });
  if(!tem)return null;
  return info.times.slice().sort(function(a,b){return pts[b]-pts[a]||sg[b]-sg[a]||gp[b]-gp[a];});
}

// ---- RESOLVE TIME ----
function resolveTime(ref,pal){
  if(!ref)return '?';
  if(ref.g){var r=calcClassPart(ref.g,pal);return r?r[ref.p-1]||'?':'?';}
  if(ref.tc!==undefined)return '3°#'+ref.tc;
  function getV(id){var p=pal['mm'+id];return p&&p.v?p.v:null;}
  function getP(id){var p=pal['mm'+id];return p&&p.p?p.p:null;}
  if(ref.s!==undefined)return getV(ref.s)||'?';
  if(ref.o!==undefined)return getV(ref.o)||'?';
  if(ref.q!==undefined)return getV(ref.q)||'?';
  if(ref.sv!==undefined)return getV(ref.sv)||'?';
  if(ref.sl!==undefined)return getP(ref.sl)||'?';
  return '?';
}

// ---- PONTUAÇÃO ----
function getPtJogo(res,pal){
  if(!res||res.a==null||!pal||pal.a==null||pal.b==null)return null;
  var ra=+res.a,rb=+res.b,pa=+pal.a,pb=+pal.b;
  if(pa===ra&&pb===rb)return 'ex';
  if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb))return 'ok';
  return 'no';
}
function calcPontos(pal){
  var total=0,acertos=0,exatos=0;
  for(var gl in G){
    G[gl].jogos.forEach(function(j){
      var res=resultadosOficiais['g'+j.id],p=pal['g'+j.id];
      if(!res||res.a==null||!p||p.a==null||p.b==null)return;
      var ra=+res.a,rb=+res.b,pa=+p.a,pb=+p.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb)){total+=5;acertos++;}
    });
    var jogosComRes=G[gl].jogos.filter(function(j){var r=resultadosOficiais['g'+j.id];return r&&r.a!=null;}).length;
    if(jogosComRes===6){
      var co=calcClassOficial(gl),cp=calcClassPart(gl,pal);
      if(co&&cp){if(co[0]&&cp[0]===co[0])total+=5;if(co[1]&&cp[1]===co[1])total+=5;}
    }
  }
  var fasesMM=[{jogos:SEG,bonus:5},{jogos:OIT,bonus:10},{jogos:QUA,bonus:15},{jogos:SEMI,bonus:20},{jogos:[TERC,FINAL],bonus:0}];
  fasesMM.forEach(function(fase){
    fase.jogos.forEach(function(j){
      var res=resultadosOficiais['mm'+j.id],p=pal['mm'+j.id];
      if(!res||res.a==null||!p||p.a==null||p.b==null)return;
      var ra=+res.a,rb=+res.b,pa=+p.a,pb=+p.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)){total+=5;acertos++;}
      if(fase.bonus>0&&res.v&&p.v===res.v)total+=fase.bonus;
    });
  });
  return {total:total,acertos:acertos,exatos:exatos};
}

// ---- FIREBASE ----
function entrar(){
  var s=document.getElementById('senhaInput').value.trim();
  if(s===SENHA_VIS){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('mainPage').style.display='flex';
    iniciar();
  }else{document.getElementById('erroLogin').textContent='Senha incorreta.';}
}
function iniciar(){
  var app=firebase.initializeApp(FBCFG);
  db=firebase.firestore();
  db.collection('admin').doc('resultados').onSnapshot(function(snap){
    if(snap.exists)resultadosOficiais=snap.data().resultados||{};
    renderRanking();mostrarPalpites();
  });
  db.collection('palpites').onSnapshot(function(snap){
    participantes=[];
    snap.forEach(function(d){participantes.push(d.data());});
    participantes.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
    var sel=document.getElementById('selPart');
    var cur=sel.value;
    sel.innerHTML='<option value="">— Selecione —</option>';
    participantes.forEach(function(p,i){sel.innerHTML+='<option value="'+i+'"'+(i==cur?' selected':'')+'>'+p.nome+'</option>';});
    if(cur===''&&participantes.length>0){sel.value='0';}
    renderRanking();mostrarPalpites();
  });
}

// ---- RANKING ----
function renderRanking(){
  var selNome=document.getElementById('selPart');
  selNome=selNome&&participantes[selNome.value]?participantes[selNome.value].nome:'';
  var lista=participantes.map(function(p){
    var r=calcPontos(p.palpites||{});
    return{nome:p.nome,total:r.total,acertos:r.acertos,exatos:r.exatos};
  }).sort(function(a,b){return b.total-a.total||b.exatos-a.exatos||b.acertos-a.acertos;});
  document.getElementById('rankSub').textContent=lista.length+' part.';
  var html='';
  lista.forEach(function(p,i){
    var cls=i===0?'p1':i===1?'p2':i===2?'p3':'';
    var ativo=p.nome===selNome?' ativo':'';
    html+='<div class="rank-row'+ativo+'">'
      +'<span class="rpos '+cls+'">'+(i+1)+'°</span>'
      +'<span class="rnome" title="'+p.nome+'">'+p.nome+'</span>'
      +'<span class="rpts">'+p.total+'</span>'
      +'</div>';
  });
  document.getElementById('rankBody').innerHTML=html||'<div class="empty">...</div>';
}

// ---- PALPITES ----
function jogoLinha(num,t1,placarPal,t2,ptCls,ptVal,resOficial){
  var temPal=placarPal!==null;
  var ptBadge='<span class="badge vz">—</span>';
  if(ptCls==='ex')ptBadge='<span class="badge ex">+'+ptVal+'</span>';
  else if(ptCls==='ok')ptBadge='<span class="badge ok">+'+ptVal+'</span>';
  else if(ptCls==='no')ptBadge='<span class="badge no">0</span>';
  var resBadge='<span class="badge vz">—</span>';
  if(resOficial!==null)resBadge='<span class="badge res">'+resOficial+'</span>';
  return '<div class="jogo-linha">'
    +'<div class="jl-jogo">'
      +'<span class="jl-num">#'+num+'</span>'
      +'<span class="jl-t1">'+t1+'</span>'
      +'<span class="jl-placar'+(temPal?'':' vazio')+'">'+( temPal?placarPal:'—')+'</span>'
      +'<span class="jl-t2">'+t2+'</span>'
    +'</div>'
    +'<div class="jl-pts">'+ptBadge+'</div>'
    +'<div class="jl-res">'+resBadge+'</div>'
    +'</div>';
}

function faseHead(cls,titulo){
  return '<div class="fase-head '+cls+'">'
    +'<div class="fh-title">'+titulo+'</div>'
    +'<div class="fh-pts">Pts</div>'
    +'<div class="fh-res">Placar Real</div>'
    +'</div>';
}

function mostrarPalpites(){
  renderRanking();
  var idx=document.getElementById('selPart').value;
  if(idx===''){document.getElementById('palWrap').innerHTML='<div class="empty">Selecione um participante acima.</div>';return;}
  var p=participantes[idx];if(!p)return;
  var pal=p.palpites||{};
  var html='';
  var grandTotal=0;

  // GRUPOS
  Object.keys(G).forEach(function(gl){
    var info=G[gl];
    html+='<div class="pal-card">';
    html+=faseHead('grupo','&#9917; GRUPO '+gl);
    info.jogos.forEach(function(j){
      var pp=pal['g'+j.id],res=resultadosOficiais['g'+j.id];
      var temPal=pp&&pp.a!=null&&pp.b!=null;
      var placarPal=temPal?pp.a+'×'+pp.b:null;
      var ptCls=getPtJogo(res,pp);
      var ptVal=ptCls==='ex'?10:ptCls==='ok'?5:0;
      if(ptCls)grandTotal+=ptVal;
      var resStr=res&&res.a!=null?res.a+'×'+res.b:null;
      html+=jogoLinha(j.id,j.t1,placarPal,j.t2,ptCls,ptVal,resStr);
    });
    html+='</div>';
  });

  // ELIMINATÓRIAS
  var fases=[
    {cls:'seg',label:'Segundas de Final',jogos:SEG,bonus:5},
    {cls:'oit',label:'Oitavas de Final',jogos:OIT,bonus:10},
    {cls:'qua',label:'Quartas de Final',jogos:QUA,bonus:15},
    {cls:'semi',label:'Semifinais',jogos:SEMI,bonus:20},
    {cls:'final',label:'3° Lugar e Final',jogos:[TERC,FINAL],bonus:0}
  ];
  fases.forEach(function(fase){
    html+='<div class="pal-card">';
    html+=faseHead(fase.cls,fase.label);
    fase.jogos.forEach(function(j){
      var pp=pal['mm'+j.id],res=resultadosOficiais['mm'+j.id];
      var t1=pp&&pp.t1?pp.t1:resolveTime(j.t1,pal);
      var t2=pp&&pp.t2?pp.t2:resolveTime(j.t2,pal);
      var temPal=pp&&pp.a!=null&&pp.b!=null;
      var placarPal=temPal?pp.a+'×'+pp.b:null;
      var ptCls=getPtJogo(res,pp);
      var ptVal=0;
      if(ptCls==='ex')ptVal=10;
      else if(ptCls==='ok')ptVal=5;
      if(fase.bonus>0&&res&&res.v&&pp&&pp.v===res.v)ptVal+=fase.bonus;
      if(ptCls)grandTotal+=ptVal;
      var resStr=res&&res.a!=null?res.a+'×'+res.b:null;
      html+=jogoLinha(j.id,t1,placarPal,t2,ptCls,ptVal,resStr);
    });
    html+='</div>';
  });

  html+='<div class="total-row"><span>TOTAL DE PONTOS</span><span style="color:#00a651">'+grandTotal+' pts</span></div>';
  document.getElementById('palWrap').innerHTML=html;
}

window.entrar=entrar;
window.mostrarPalpites=mostrarPalpites;
</script>
</body>
</html>

// ============================================================
// MOTOR DE CLASSIFICAÇÃO (baseado nos palpites do participante)
// ============================================================
function classificarGrupo(gl, palpites) {
  var info = G[gl], pts={}, sg={}, gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  info.jogos.forEach(function(j){
    var p = palpites['g'+j.id];
    if(!p||p.a==null||p.b==null) return;
    var a=+p.a,b=+p.b; if(isNaN(a)||isNaN(b)) return;
    gp[j.t1]+=a;gp[j.t2]+=b;
    sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]+=1;pts[j.t2]+=1;}
  });
  return info.times.slice().sort(function(a,b){
    if(pts[b]!==pts[a])return pts[b]-pts[a];
    if(sg[b]!==sg[a])return sg[b]-sg[a];
    return gp[b]-gp[a];
  }).map(function(t){return{nome:t,pts:pts[t],sg:sg[t],gp:gp[t]};});
}

function calcTerceiros(palpites) {
  var lista=[];
  Object.keys(G).forEach(function(gl){
    var r=classificarGrupo(gl,palpites);
    var temP=G[gl].jogos.some(function(j){var p=palpites['g'+j.id];return p&&p.a!=null&&p.b!=null;});
    lista.push({nome:temP?r[2].nome:null,grupo:gl,pts:r[2].pts,sg:r[2].sg,gp:r[2].gp,tem:temP});
  });
  lista.sort(function(a,b){
    if(!a.tem&&!b.tem)return 0;if(!a.tem)return 1;if(!b.tem)return -1;
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.sg!==a.sg)return b.sg-a.sg;
    return b.gp-a.gp;
  });
  return lista;
}

function resolveGrupo(ref, palpites) {
  if(ref.g){
    var r=classificarGrupo(ref.g,palpites);
    var tem=G[ref.g].jogos.some(function(j){var p=palpites['g'+j.id];return p&&p.a!=null&&p.b!=null;});
    if(!tem)return null;
    return r[ref.p-1]?r[ref.p-1].nome:null;
  }
  if(ref.tc!==undefined){
    var tc=calcTerceiros(palpites);
    var item=tc[ref.tc-1];
    return (item&&item.nome)?item.nome+'(3°'+item.grupo+')':null;
  }
  return null;
}

// Resolve vencedor de uma segunda/oitava/quarta/semi a partir dos palpites
function resolveVencedor(jogoId, palpites) {
  var p = palpites['mm'+jogoId];
  if(!p||p.v==null) return null;
  // p.v = nome do time vencedor (digitado/salvo)
  return p.v||null;
}

function resolvePerdedor(jogoId, palpites) {
  var p = palpites['mm'+jogoId];
  if(!p||p.v==null) return null;
  return p.p||null;
}

function resolveTimeSegunda(ref, palpites) {
  if(ref.g||ref.tc!==undefined) return resolveGrupo(ref,palpites);
  if(ref.s!==undefined) return resolveVencedor(ref.s,palpites);
  if(ref.o!==undefined) return resolveVencedor(ref.o,palpites);
  if(ref.q!==undefined) return resolveVencedor(ref.q,palpites);
  if(ref.sv!==undefined) return resolveVencedor(ref.sv,palpites);
  if(ref.sl!==undefined) return resolvePerdedor(ref.sl,palpites);
  return null;
}

// ============================================================
// CÁLCULO DE PONTOS
// ============================================================
function calcPontos(participante){
  var palpites=participante.palpites||{};
  var total=0, acertos=0, exatos=0;

  // Fase de grupos
  for(var gl in G){
    G[gl].jogos.forEach(function(j){
      var res=resultadosOficiais['g'+j.id];
      var palp=palpites['g'+j.id];
      if(!res||res.a==null||res.b==null) return;
      if(!palp||palp.a==null||palp.b==null) return;
      var ra=+res.a,rb=+res.b,pa=+palp.a,pb=+palp.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb)){total+=5;acertos++;}
    });
    // Bônus 1° e 2° do grupo
    var rClass=resultadosOficiais['class_'+gl];
    var pClass=palpites['class_'+gl];
    if(rClass&&pClass){
      if(rClass.p1&&pClass.p1===rClass.p1) total+=5;
      if(rClass.p2&&pClass.p2===rClass.p2) total+=5;
    }
  }

  // Mata-mata: resultado + bônus por classificado
  var fases=[
    {jogos:SEG, bonus:BONUS.segundas},
    {jogos:OIT, bonus:BONUS.oitavas},
    {jogos:QUA, bonus:BONUS.quartas},
    {jogos:SEMI, bonus:BONUS.semi},
    {jogos:[TERC,FINAL], bonus:0}
  ];
  fases.forEach(function(fase){
    fase.jogos.forEach(function(j){
      var res=resultadosOficiais['mm'+j.id];
      var palp=palpites['mm'+j.id];
      if(!res||res.a==null||res.b==null) return;
      if(!palp||palp.a==null||palp.b==null) return;
      var ra=+res.a,rb=+res.b,pa=+palp.a,pb=+palp.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)){total+=5;acertos++;}
      // Bônus classificado
      if(fase.bonus>0&&res.v&&palp.v===res.v) total+=fase.bonus;
    });
  });

  // Bônus especiais final
  var resFinal=resultadosOficiais['mm'+FINAL.id];
  if(resFinal&&resFinal.v){
    var pFinal=palpites['mm'+FINAL.id];
    if(pFinal){
      // Acertar quem vai à final (+30 cada time)
      var rTeams=[resFinal.v,resFinal.p].filter(Boolean);
      var pTeams=[(pFinal.v),(pFinal.p)].filter(Boolean);
      rTeams.forEach(function(t){if(pTeams.indexOf(t)>=0)total+=30;});
      // Campeão +50 já está implícito no bônus classificado da semi? Não — é extra
      // Vice +45
      if(resFinal.p&&pFinal.p===resFinal.p) total+=45;
      // Campeão +50 (além do bônus de semi)
      if(pFinal.v===resFinal.v) total+=50;
    }
  }
  var resTerc=resultadosOficiais['mm'+TERC.id];
  if(resTerc&&resTerc.v){
    var pTerc=palpites['mm'+TERC.id];
    if(pTerc&&pTerc.v===resTerc.v) total+=40;
  }

  return {total:total, acertos:acertos, exatos:exatos};
}

      +'</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('rankingBody').innerHTML = html;
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef0f5;color:#111;min-height:100vh}
.hd{background:linear-gradient(140deg,#002776 0%,#003ab2 55%,#007a3d 100%);padding:14px;text-align:center}
.hd h1{font-size:1.4rem;font-weight:900;color:#f5d400;letter-spacing:2px}
.hd p{font-size:.72rem;color:rgba(255,255,255,.65);margin-top:3px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:24px;margin:20px;max-width:320px;width:100%}
.modal h2{font-size:1rem;font-weight:900;color:#002776;margin-bottom:6px}
.modal p{font-size:.8rem;color:#555;margin-bottom:14px}
.modal input{width:100%;border:2px solid #dde2ef;border-radius:8px;padding:10px;font-size:1.2rem;outline:none;margin-bottom:10px;letter-spacing:6px;text-align:center;font-weight:900}
.modal input:focus{border-color:#00a651}
.modal button{width:100%;background:#00a651;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.92rem;font-weight:900;cursor:pointer}
.erro{color:#c0392b;font-size:.75rem;text-align:center;margin-top:6px}

/* LAYOUT */
.layout{display:flex;gap:12px;padding:12px;max-width:1200px;margin:0 auto}
.col-rank{width:220px;flex-shrink:0}
.col-pal{flex:1;min-width:0}
.col-pts{width:80px;flex-shrink:0}

/* COLUNA DE PONTOS */
.pts-col-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden;position:sticky;top:10px}
.pts-col-head{background:#007a3d;color:#fff;font-size:.72rem;font-weight:900;padding:8px 10px;letter-spacing:1px;text-align:center}
.pts-col-body{padding:6px 6px}
.pts-section-label{font-size:.6rem;font-weight:900;color:#002776;text-transform:uppercase;letter-spacing:.5px;padding:8px 4px 3px;text-align:center;border-top:1px solid #f0f3f8;margin-top:4px}
.pts-section-label:first-child{border-top:none;margin-top:0;padding-top:4px}
.pts-line{height:27px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #f8f9fc}
.pts-line:last-child{border-bottom:none}
.pts-line .pts-badge{font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 6px;min-width:28px;text-align:center}
.pts-badge.ex{background:#007a3d;color:#fff}
.pts-badge.ok{background:#e8601c;color:#fff}
.pts-badge.no{background:#eee;color:#aaa}
.pts-badge.vz{background:transparent;color:transparent}

/* RANKING */
.rank-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden;position:sticky;top:10px}
.rank-head{background:#002776;color:#f5d400;font-size:.78rem;font-weight:900;padding:8px 12px;letter-spacing:1.5px;display:flex;justify-content:space-between;align-items:center}
.rank-head span{color:rgba(255,255,255,.5);font-size:.65rem;font-weight:400}
.rank-row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #f0f3f8;gap:6px}
.rank-row:last-child{border-bottom:none}
.rank-row.destaque{background:#fffbea}
.rpos{font-size:1rem;font-weight:900;width:22px;flex-shrink:0}
.rpos.p1{color:#b8860b}.rpos.p2{color:#7a8aaa}.rpos.p3{color:#a06030}
.rnome{flex:1;font-size:.76rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpts{font-size:.95rem;font-weight:900;color:#00a651}

/* SELETOR */
.sel-wrap{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,39,118,.08)}
.sel-wrap label{font-size:.72rem;font-weight:700;color:#002776;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
select{width:100%;background:#f4f6fb;border:2px solid #dde2ef;border-radius:8px;padding:9px;font-size:.9rem;font-weight:700;color:#002776;outline:none}
select:focus{border-color:#00a651}

/* PALPITES */
.pcard{background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.pcard-head{padding:7px 12px;font-weight:900;font-size:.78rem;letter-spacing:1.5px;color:#fff}
.pcard-head.grupo{background:#002776;color:#f5d400}
.pcard-head.seg{background:#1a6b3a}
.pcard-head.oit{background:#15548a}
.pcard-head.qua{background:#7a1a8b}
.pcard-head.semi{background:#8b3a00}
.pcard-head.final{background:#8b0000}
.jrow{display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid #f0f3f8;gap:4px;font-size:.76rem}
.jrow:last-child{border-bottom:none}
.jnum{color:#9ab;font-size:.62rem;font-weight:700;width:20px;flex-shrink:0}
.tname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname.r{text-align:right}
.placar{font-weight:900;color:#002776;font-size:.9rem;background:#f4f6fb;border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.placar.vazio{color:#ccc;background:transparent}
.pts-badge{font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 6px;flex-shrink:0;min-width:28px;text-align:center}
.pts-badge.ex{background:#007a3d;color:#fff}
.pts-badge.ok{background:#e8601c;color:#fff}
.pts-badge.no{background:#eee;color:#aaa}

.empty{text-align:center;padding:30px;color:#9ab;font-size:.82rem}

/* MOBILE */
@media(max-width:680px){
  .layout{flex-direction:column}
  .col-rank{width:100%;position:static}
  .col-pts{display:none}
  .rank-card{position:static}
  .jrow .pts-badge{display:inline-flex}
}
@media(min-width:681px){
  .jrow .pts-badge{display:none}
}
</style>

var QUA=[{id:97,t1:{o:89},t2:{o:90}},{id:98,t1:{o:91},t2:{o:92}},{id:99,t1:{o:93},t2:{o:94}},{id:100,t1:{o:95},t2:{o:96}}];

var db, participantes=[], resultadosOficiais={};

// ============================================================
// PONTUAÇÃO
// ============================================================
function calcClassOficial(gl){
  var info=G[gl],pts={},sg={},gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  var tem=false;
  info.jogos.forEach(function(j){
    var r=resultadosOficiais['g'+j.id];if(!r||r.a==null)return;
    tem=true;var a=+r.a,b=+r.b;
    gp[j.t1]+=a;gp[j.t2]+=b;sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]++;pts[j.t2]++;}
  });
  if(!tem)return null;
  return info.times.slice().sort(function(a,b){return pts[b]-pts[a]||sg[b]-sg[a]||gp[b]-gp[a];});
}
function calcClassPart(gl,pal){
  var info=G[gl],pts={},sg={},gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  var tem=false;
  info.jogos.forEach(function(j){
    var p=pal['g'+j.id];if(!p||p.a==null||p.b==null)return;
    tem=true;var a=+p.a,b=+p.b;
    gp[j.t1]+=a;gp[j.t2]+=b;sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]++;pts[j.t2]++;}
  });
  if(!tem)return null;
  return info.times.slice().sort(function(a,b){return pts[b]-pts[a]||sg[b]-sg[a]||gp[b]-gp[a];});
}

function calcPontos(pal){
  var total=0,acertos=0,exatos=0;
  for(var gl in G){
    G[gl].jogos.forEach(function(j){
      var res=resultadosOficiais['g'+j.id];
      var p=pal['g'+j.id];
      if(!res||res.a==null||!p||p.a==null||p.b==null)return;
      var ra=+res.a,rb=+res.b,pa=+p.a,pb=+p.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb)){total+=5;acertos++;}
    });
    var jogosComRes=G[gl].jogos.filter(function(j){var r=resultadosOficiais['g'+j.id];return r&&r.a!=null;}).length;
    if(jogosComRes===6){
      var co=calcClassOficial(gl),cp=calcClassPart(gl,pal);
      if(co&&cp){
        if(co[0]&&cp[0]===co[0])total+=5;
        if(co[1]&&cp[1]===co[1])total+=5;
      }
    }
  }
  var fasesMM=[{jogos:SEG,bonus:BONUS.segundas},{jogos:OIT,bonus:BONUS.oitavas},{jogos:QUA,bonus:BONUS.quartas},{jogos:SEMI,bonus:BONUS.semi},{jogos:[TERC,FINAL],bonus:0}];
  fasesMM.forEach(function(fase){
    fase.jogos.forEach(function(j){
      var res=resultadosOficiais['mm'+j.id];
      var p=pal['mm'+j.id];
      if(!res||res.a==null||!p||p.a==null||p.b==null)return;
      var ra=+res.a,rb=+res.b,pa=+p.a,pb=+p.b;
      if(pa===ra&&pb===rb){total+=10;exatos++;acertos++;}
      else if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)){total+=5;acertos++;}
      if(fase.bonus>0&&res.v&&p.v===res.v)total+=fase.bonus;
    });
  });
  return {total:total,acertos:acertos,exatos:exatos};
}

function getPtJogo(res, pal){
  if(!res||res.a==null||!pal||pal.a==null||pal.b==null)return null;
  var ra=+res.a,rb=+res.b,pa=+pal.a,pb=+pal.b;
  if(pa===ra&&pb===rb)return 'ex';
  if((ra>rb&&pa>pb)||(ra<rb&&pa<pb)||(ra===rb&&pa===pb))return 'ok';
  return 'no';
}

// ============================================================
// RESOLVE TIME
// ============================================================
function resolveTime(ref,pal){
  if(!ref)return '?';
  if(ref.g){
    var r=calcClassPart(ref.g,pal);
    return r?r[ref.p-1]||'?':'?';
  }
  if(ref.tc!==undefined)return '3°#'+ref.tc;
  function getV(id){var p=pal['mm'+id];return p&&p.v?p.v:null;}
  function getP(id){var p=pal['mm'+id];return p&&p.p?p.p:null;}
  if(ref.s!==undefined)return getV(ref.s)||'?';
  if(ref.o!==undefined)return getV(ref.o)||'?';
  if(ref.q!==undefined)return getV(ref.q)||'?';
  if(ref.sv!==undefined)return getV(ref.sv)||'?';
  if(ref.sl!==undefined)return getP(ref.sl)||'?';
  return '?';
}

// ============================================================
// INIT
// ============================================================
function entrar(){
  var s=document.getElementById('senhaInput').value.trim();
  if(s===SENHA_VIS){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('mainLayout').style.display='flex';
    iniciar();
  } else {
    document.getElementById('erroLogin').textContent='Senha incorreta.';
  }
}

function iniciar(){
  var app=firebase.initializeApp(FBCFG);
  db=firebase.firestore();
  db.collection('admin').doc('resultados').onSnapshot(function(snap){
    if(snap.exists)resultadosOficiais=snap.data().resultados||{};
    renderRanking();
    mostrarPalpites();
  });
  db.collection('palpites').onSnapshot(function(snap){
    participantes=[];
    snap.forEach(function(d){participantes.push(d.data());});
    participantes.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
    var sel=document.getElementById('selPart');
    var cur=sel.value;
    sel.innerHTML='<option value="">— Selecione para ver os palpites —</option>';
    participantes.forEach(function(p,i){
      sel.innerHTML+='<option value="'+i+'"'+(i==cur?' selected':'')+'>'+p.nome+'</option>';
    });
    renderRanking();
    if(cur!=='')mostrarPalpites();
  });
}

// ============================================================
// RANKING
// ============================================================
function renderRanking(){
  var selIdx = document.getElementById('selPart').value;
  var selNome = selIdx!==''&&participantes[selIdx]?participantes[selIdx].nome:'';
  var lista=participantes.map(function(p){
    var r=calcPontos(p.palpites||{});
    return {nome:p.nome,total:r.total,acertos:r.acertos,exatos:r.exatos};
  }).sort(function(a,b){return b.total-a.total||b.exatos-a.exatos||b.acertos-a.acertos;});
  document.getElementById('rankSubtitle').textContent=lista.length+' part.';
  var html='';
  lista.forEach(function(p,i){
    var cls=i===0?'p1':i===1?'p2':i===2?'p3':'';
    var dest=p.nome===selNome?' destaque':'';
    html+='<div class="rank-row'+dest+'">'
      +'<span class="rpos '+cls+'">'+(i+1)+'°</span>'
      +'<span class="rnome" title="'+p.nome+'">'+p.nome+'</span>'
      +'<span class="rpts">'+p.total+'</span>'
      +'</div>';
  });
  document.getElementById('rankBody').innerHTML=html||'<div class="empty">Aguardando...</div>';
}

// ============================================================
// PALPITES
// ============================================================
function mostrarPalpites(){
  var idx=document.getElementById('selPart').value;
  renderRanking(); // refresh highlight
  if(idx===''){
    document.getElementById('palpitesWrap').innerHTML='<div class="empty">Selecione um participante acima para ver os palpites.</div>';
    document.getElementById('ptsColBody').innerHTML='';
    return;
  }
  var p=participantes[idx];
  if(!p)return;
  var pal=p.palpites||{};
  var html='';

  // GRUPOS
  Object.keys(G).forEach(function(gl){
    var info=G[gl];
    html+='<div class="pcard"><div class="pcard-head grupo">&#9917; GRUPO '+gl+'</div>';
    info.jogos.forEach(function(j){
      var pp=pal['g'+j.id];
      var res=resultadosOficiais['g'+j.id];
      var va=pp&&pp.a!=null?pp.a:null;
      var vb=pp&&pp.b!=null?pp.b:null;
      var temP=va!=null&&vb!=null;
      var ptCls=getPtJogo(res,pp);
      var ptHtml='';
      if(ptCls==='ex') ptHtml='<span class="pts-badge ex">+10</span>';
      else if(ptCls==='ok') ptHtml='<span class="pts-badge ok">+5</span>';
      else if(ptCls==='no') ptHtml='<span class="pts-badge no">0</span>';
      html+='<div class="jrow">'
        +'<span class="jnum">#'+j.id+'</span>'
        +'<span class="tname">'+j.t1+'</span>'
        +'<span class="placar'+(temP?'':' vazio')+'">'+(temP?va+'×'+vb:'—')+'</span>'
        +'<span class="tname r">'+j.t2+'</span>'
        +ptHtml
        +'</div>';
    });
    html+='</div>';
  });

  // ELIMINATÓRIAS
  var fases=[
    {label:'SEGUNDAS DE FINAL',jogos:SEG,cls:'seg',bonus:5},
    {label:'OITAVAS DE FINAL',jogos:OIT,cls:'oit',bonus:10},
    {label:'QUARTAS DE FINAL',jogos:QUA,cls:'qua',bonus:15},
    {label:'SEMIFINAIS',jogos:SEMI,cls:'semi',bonus:20},
    {label:'3° LUGAR E FINAL',jogos:[TERC,FINAL],cls:'final',bonus:0}
  ];
  fases.forEach(function(fase){
    html+='<div class="pcard"><div class="pcard-head '+fase.cls+'">'+fase.label+'</div>';
    fase.jogos.forEach(function(j){
      var pp=pal['mm'+j.id];
      var res=resultadosOficiais['mm'+j.id];
      var va=pp&&pp.a!=null?pp.a:null;
      var vb=pp&&pp.b!=null?pp.b:null;
      var t1=pp&&pp.t1?pp.t1:resolveTime(j.t1,pal);
      var t2=pp&&pp.t2?pp.t2:resolveTime(j.t2,pal);
      var temP=va!=null&&vb!=null;
      var ptCls=getPtJogo(res,pp);
      var pts=0;
      if(ptCls==='ex')pts=10;
      else if(ptCls==='ok')pts=5;
      if(fase.bonus>0&&res&&res.v&&pp&&pp.v===res.v)pts+=fase.bonus;
      var ptHtml='';
      if(res&&res.a!=null&&pp&&pp.a!=null){
        if(pts>0) ptHtml='<span class="pts-badge '+(ptCls==='ex'?'ex':'ok')+'">+'+pts+'</span>';
        else ptHtml='<span class="pts-badge no">0</span>';
      }
      html+='<div class="jrow">'
        +'<span class="jnum">#'+j.id+'</span>'
        +'<span class="tname">'+t1+'</span>'
        +'<span class="placar'+(temP?'':' vazio')+'">'+(temP?va+'×'+vb:'—')+'</span>'
        +'<span class="tname r">'+t2+'</span>'
        +ptHtml
        +'</div>';
    });
    html+='</div>';
  });

  document.getElementById('palpitesWrap').innerHTML=html;
  renderPtsCol(pal);
}

function renderPtsCol(pal){
  var el=document.getElementById('ptsColBody');
  if(!el)return;
  var html='';

  // GRUPOS
  Object.keys(G).forEach(function(gl){
    var info=G[gl];
    html+='<div class="pts-section-label">Gr.'+gl+'</div>';
    info.jogos.forEach(function(j){
      var pp=pal['g'+j.id];
      var res=resultadosOficiais['g'+j.id];
      var ptCls=getPtJogo(res,pp);
      if(ptCls==='ex') html+='<div class="pts-line"><span class="pts-badge ex">+10</span></div>';
      else if(ptCls==='ok') html+='<div class="pts-line"><span class="pts-badge ok">+5</span></div>';
      else if(ptCls==='no') html+='<div class="pts-line"><span class="pts-badge no">0</span></div>';
      else html+='<div class="pts-line"><span class="pts-badge vz">—</span></div>';
    });
  });

  // ELIMINATÓRIAS
  var fases=[
    {label:'Seg.',jogos:SEG,bonus:5},
    {label:'Oit.',jogos:OIT,bonus:10},
    {label:'Qua.',jogos:QUA,bonus:15},
    {label:'Semi',jogos:SEMI,bonus:20},
    {label:'Final',jogos:[TERC,FINAL],bonus:0}
  ];
  fases.forEach(function(fase){
    html+='<div class="pts-section-label">'+fase.label+'</div>';
    fase.jogos.forEach(function(j){
      var pp=pal['mm'+j.id];
      var res=resultadosOficiais['mm'+j.id];
      var ptCls=getPtJogo(res,pp);
      var pts=0;
      if(ptCls==='ex')pts=10;
      else if(ptCls==='ok')pts=5;
      if(fase.bonus>0&&res&&res.v&&pp&&pp.v===res.v)pts+=fase.bonus;
      if(res&&res.a!=null&&pp&&pp.a!=null){
        if(pts>0) html+='<div class="pts-line"><span class="pts-badge '+(ptCls==='ex'?'ex':'ok')+'">+'+pts+'</span></div>';
        else html+='<div class="pts-line"><span class="pts-badge no">0</span></div>';
      } else {
        html+='<div class="pts-line"><span class="pts-badge vz">—</span></div>';
      }
    });
  });

  el.innerHTML=html;
}

window.entrar=entrar;
window.mostrarPalpites=mostrarPalpites;
</script>

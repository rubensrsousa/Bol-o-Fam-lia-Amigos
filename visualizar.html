<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palpites — Bolão Copa 2026</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#eef0f5;color:#111;min-height:100vh}
.hd{background:linear-gradient(140deg,#002776 0%,#003ab2 55%,#007a3d 100%);padding:16px;text-align:center}
.hd h1{font-size:1.5rem;font-weight:900;color:#f5d400;letter-spacing:2px}
.hd p{font-size:.75rem;color:rgba(255,255,255,.7);margin-top:3px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:24px;margin:20px;max-width:340px;width:100%}
.modal h2{font-size:1.1rem;font-weight:900;color:#002776;margin-bottom:8px}
.modal p{font-size:.82rem;color:#555;margin-bottom:16px}
.modal input{width:100%;border:2px solid #dde2ef;border-radius:8px;padding:10px;font-size:.95rem;outline:none;margin-bottom:12px;letter-spacing:4px;text-align:center;font-weight:700}
.modal input:focus{border-color:#00a651}
.modal button{width:100%;background:#00a651;color:#fff;border:none;border-radius:10px;padding:12px;font-size:.95rem;font-weight:900;cursor:pointer}
.modal .erro{color:#c0392b;font-size:.78rem;text-align:center;margin-top:8px}
main{max-width:700px;margin:0 auto;padding:14px}
.sel-wrap{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,39,118,.08)}
.sel-wrap label{font-size:.75rem;font-weight:700;color:#002776;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
select{width:100%;background:#f4f6fb;border:2px solid #dde2ef;border-radius:8px;padding:10px;font-size:.95rem;font-weight:700;color:#002776;outline:none}
select:focus{border-color:#00a651}
.card{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,39,118,.08);overflow:hidden}
.card-head{padding:8px 12px;font-weight:900;font-size:.82rem;letter-spacing:1.5px;color:#fff}
.card-head.grupo{background:#002776;color:#f5d400}
.card-head.seg{background:#1a6b3a}
.card-head.oit{background:#15548a}
.card-head.qua{background:#7a1a8b}
.card-head.semi{background:#8b3a00}
.card-head.final{background:#8b0000}
.jogo-row{display:flex;align-items:center;padding:6px 12px;border-bottom:1px solid #f0f3f8;font-size:.78rem;gap:4px}
.jogo-row:last-child{border-bottom:none}
.jnum{color:#9ab;font-size:.65rem;font-weight:700;width:22px}
.tname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname.r{text-align:right}
.placar{font-weight:900;color:#002776;font-size:1rem;background:#f4f6fb;border-radius:6px;padding:2px 8px;white-space:nowrap}
.placar.vazio{color:#ccc;background:transparent}
.empty{text-align:center;padding:40px;color:#9ab;font-size:.85rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:#fff;border-radius:8px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,39,118,.08);flex:1;min-width:80px;text-align:center}
.stat-n{font-size:1.4rem;font-weight:900;color:#00a651}
.stat-l{font-size:.65rem;color:#9ab;margin-top:2px}
</style>
</head>
<body>

<div class="overlay" id="loginWrap">
  <div class="modal">
    <h2>&#128274; Bolão Copa 2026</h2>
    <p>Digite a senha para visualizar os palpites de todos os participantes.</p>
    <input type="password" id="senhaInput" placeholder="••••" maxlength="10" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Ver Palpites &#8594;</button>
    <div class="erro" id="erroLogin"></div>
  </div>
</div>

<div class="hd">
  <h1>&#127942; Bolão Copa 2026</h1>
  <p>Visualização de palpites · somente leitura</p>
</div>

<main id="main" style="display:none">
  <div class="sel-wrap">
    <label>&#128100; Selecione o participante</label>
    <select id="selPart" onchange="mostrarPalpites()">
      <option value="">— Selecione —</option>
    </select>
  </div>
  <div id="statsWrap"></div>
  <div id="palpitesWrap"><div class="empty">Selecione um participante acima para ver os palpites.</div></div>
</main>

<script>
var SENHA_VIS = 'copa2026';

var FBCFG = {
  apiKey: "AIzaSyD_Txft2f70W7srOdv0RCYvdcDvdDPu80c",
  authDomain: "bolao-2026-40ed7.firebaseapp.com",
  projectId: "bolao-2026-40ed7",
  storageBucket: "bolao-2026-40ed7.firebasestorage.app",
  messagingSenderId: "62349776640",
  appId: "1:62349776640:web:bd1d43c7dc8d89a8b8c5e5"
};

var G = {
  A:{times:['México','África do Sul','Coreia do Sul','Rep. Tcheca'],jogos:[{id:1,t1:'México',t2:'África do Sul'},{id:2,t1:'Coreia do Sul',t2:'Rep. Tcheca'},{id:3,t1:'Coreia do Sul',t2:'México'},{id:4,t1:'Coreia do Sul',t2:'África do Sul'},{id:5,t1:'México',t2:'Rep. Tcheca'},{id:6,t1:'Rep. Tcheca',t2:'África do Sul'}]},
  B:{times:['Canadá','Bósnia','Catar','Suíça'],jogos:[{id:7,t1:'Canadá',t2:'Bósnia'},{id:8,t1:'Catar',t2:'Suíça'},{id:9,t1:'Bósnia',t2:'Catar'},{id:10,t1:'Bósnia',t2:'Suíça'},{id:11,t1:'Canadá',t2:'Catar'},{id:12,t1:'Canadá',t2:'Suíça'}]},
  C:{times:['Brasil','Marrocos','Haiti','Escócia'],jogos:[{id:13,t1:'Brasil',t2:'Marrocos'},{id:14,t1:'Haiti',t2:'Escócia'},{id:15,t1:'Brasil',t2:'Escócia'},{id:16,t1:'Brasil',t2:'Haiti'},{id:17,t1:'Escócia',t2:'Marrocos'},{id:18,t1:'Haiti',t2:'Marrocos'}]},
  D:{times:['EUA','Paraguai','Austrália','Turquia'],jogos:[{id:19,t1:'EUA',t2:'Paraguai'},{id:20,t1:'Austrália',t2:'Turquia'},{id:21,t1:'Austrália',t2:'EUA'},{id:22,t1:'Austrália',t2:'Paraguai'},{id:23,t1:'EUA',t2:'Turquia'},{id:24,t1:'Paraguai',t2:'Turquia'}]},
  E:{times:['Alemanha','Curaçao','C. Marfim','Equador'],jogos:[{id:25,t1:'Alemanha',t2:'Curaçao'},{id:26,t1:'C. Marfim',t2:'Equador'},{id:27,t1:'Alemanha',t2:'C. Marfim'},{id:28,t1:'Alemanha',t2:'Equador'},{id:29,t1:'C. Marfim',t2:'Curaçao'},{id:30,t1:'Curaçao',t2:'Equador'}]},
  F:{times:['Holanda','Japão','Suécia','Tunísia'],jogos:[{id:31,t1:'Holanda',t2:'Japão'},{id:32,t1:'Suécia',t2:'Tunísia'},{id:33,t1:'Holanda',t2:'Suécia'},{id:34,t1:'Holanda',t2:'Tunísia'},{id:35,t1:'Japão',t2:'Suécia'},{id:36,t1:'Japão',t2:'Tunísia'}]},
  G:{times:['Bélgica','Egito','Irã','N. Zelândia'],jogos:[{id:37,t1:'Bélgica',t2:'Egito'},{id:38,t1:'Irã',t2:'N. Zelândia'},{id:39,t1:'Bélgica',t2:'Irã'},{id:40,t1:'Bélgica',t2:'N. Zelândia'},{id:41,t1:'Egito',t2:'Irã'},{id:42,t1:'Egito',t2:'N. Zelândia'}]},
  H:{times:['Espanha','Cabo Verde','Ar. Saudita','Uruguai'],jogos:[{id:43,t1:'Espanha',t2:'Cabo Verde'},{id:44,t1:'Ar. Saudita',t2:'Uruguai'},{id:45,t1:'Ar. Saudita',t2:'Cabo Verde'},{id:46,t1:'Ar. Saudita',t2:'Espanha'},{id:47,t1:'Cabo Verde',t2:'Uruguai'},{id:48,t1:'Espanha',t2:'Uruguai'}]},
  I:{times:['França','Senegal','Iraque','Noruega'],jogos:[{id:49,t1:'França',t2:'Senegal'},{id:50,t1:'Iraque',t2:'Noruega'},{id:51,t1:'França',t2:'Iraque'},{id:52,t1:'França',t2:'Noruega'},{id:53,t1:'Iraque',t2:'Senegal'},{id:54,t1:'Noruega',t2:'Senegal'}]},
  J:{times:['Argentina','Argélia','Áustria','Jordânia'],jogos:[{id:55,t1:'Argentina',t2:'Argélia'},{id:56,t1:'Áustria',t2:'Jordânia'},{id:57,t1:'Argentina',t2:'Jordânia'},{id:58,t1:'Argentina',t2:'Áustria'},{id:59,t1:'Argélia',t2:'Jordânia'},{id:60,t1:'Argélia',t2:'Áustria'}]},
  K:{times:['Portugal','RD Congo','Uzbequistão','Colômbia'],jogos:[{id:61,t1:'Portugal',t2:'RD Congo'},{id:62,t1:'Uzbequistão',t2:'Colômbia'},{id:63,t1:'Colômbia',t2:'Portugal'},{id:64,t1:'Colômbia',t2:'RD Congo'},{id:65,t1:'Portugal',t2:'Uzbequistão'},{id:66,t1:'RD Congo',t2:'Uzbequistão'}]},
  L:{times:['Inglaterra','Croácia','Gana','Panamá'],jogos:[{id:67,t1:'Inglaterra',t2:'Croácia'},{id:68,t1:'Gana',t2:'Panamá'},{id:69,t1:'Croácia',t2:'Gana'},{id:70,t1:'Croácia',t2:'Panamá'},{id:71,t1:'Inglaterra',t2:'Gana'},{id:72,t1:'Inglaterra',t2:'Panamá'}]}
};

var SEG=[{id:73,t1:{g:'A',p:2},t2:{g:'B',p:2}},{id:74,t1:{g:'E',p:1},t2:{tc:1}},{id:75,t1:{g:'F',p:1},t2:{g:'C',p:2}},{id:76,t1:{g:'C',p:1},t2:{g:'F',p:2}},{id:77,t1:{g:'I',p:1},t2:{tc:2}},{id:78,t1:{g:'E',p:2},t2:{g:'I',p:2}},{id:79,t1:{g:'A',p:1},t2:{tc:3}},{id:80,t1:{g:'L',p:1},t2:{tc:4}},{id:81,t1:{g:'D',p:1},t2:{tc:5}},{id:82,t1:{g:'G',p:1},t2:{tc:6}},{id:83,t1:{g:'K',p:2},t2:{g:'L',p:2}},{id:84,t1:{g:'H',p:1},t2:{g:'J',p:2}},{id:85,t1:{g:'B',p:1},t2:{tc:7}},{id:86,t1:{g:'J',p:1},t2:{g:'H',p:2}},{id:87,t1:{g:'K',p:1},t2:{tc:8}},{id:88,t1:{g:'D',p:2},t2:{g:'G',p:2}}];
var OIT=[{id:89,t1:{s:73},t2:{s:74}},{id:90,t1:{s:75},t2:{s:76}},{id:91,t1:{s:77},t2:{s:78}},{id:92,t1:{s:79},t2:{s:80}},{id:93,t1:{s:81},t2:{s:82}},{id:94,t1:{s:83},t2:{s:84}},{id:95,t1:{s:85},t2:{s:86}},{id:96,t1:{s:87},t2:{s:88}}];
var QUA=[{id:97,t1:{o:89},t2:{o:90}},{id:98,t1:{o:91},t2:{o:92}},{id:99,t1:{o:93},t2:{o:94}},{id:100,t1:{o:95},t2:{o:96}}];
var SEMI=[{id:101,t1:{q:97},t2:{q:98}},{id:102,t1:{q:99},t2:{q:100}}];
var TERC={id:103,t1:{sl:101},t2:{sl:102}};
var FINAL={id:104,t1:{sv:101},t2:{sv:102}};

var db, participantes=[];

function entrar(){
  var s=document.getElementById('senhaInput').value.trim();
  if(s===SENHA_VIS){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('main').style.display='block';
    iniciar();
  } else {
    document.getElementById('erroLogin').textContent='Senha incorreta.';
  }
}

function iniciar(){
  var app=firebase.initializeApp(FBCFG);
  db=firebase.firestore();
  db.collection('palpites').onSnapshot(function(snap){
    participantes=[];
    snap.forEach(function(d){participantes.push(d.data());});
    participantes.sort(function(a,b){return a.nome.localeCompare(b.nome);});
    var sel=document.getElementById('selPart');
    var cur=sel.value;
    sel.innerHTML='<option value="">— Selecione —</option>';
    participantes.forEach(function(p,i){
      sel.innerHTML+='<option value="'+i+'"'+(i==cur?' selected':'')+'>'+p.nome+'</option>';
    });
    if(cur) mostrarPalpites();
  });
}

function resolveTime(ref, pal){
  if(!ref) return '?';
  function getV(id){var pp=pal['mm'+id];return pp&&pp.v?pp.v:null;}
  function getP(id){var pp=pal['mm'+id];return pp&&pp.p?pp.p:null;}
  if(ref.g){
    var info=G[ref.g],pts={},sg={},gp={};
    info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
    var tem=false;
    info.jogos.forEach(function(j){
      var p=pal['g'+j.id];if(!p||p.a==null||p.b==null)return;
      tem=true;var a=+p.a,b=+p.b;
      gp[j.t1]+=a;gp[j.t2]+=b;sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
      if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]++;pts[j.t2]++;}
    });
    if(!tem)return '?';
    var r=info.times.slice().sort(function(a,b){return pts[b]-pts[a]||sg[b]-sg[a]||gp[b]-gp[a];});
    return r[ref.p-1]||'?';
  }
  if(ref.s!==undefined){var pp=pal['mm'+ref.s];return pp&&pp.t1?getV(ref.s)||(pp.a>pp.b?pp.t1:pp.b>pp.a?pp.t2:'?'):'?';}
  if(ref.o!==undefined) return getV(ref.o)||'?';
  if(ref.q!==undefined) return getV(ref.q)||'?';
  if(ref.sv!==undefined) return getV(ref.sv)||'?';
  if(ref.sl!==undefined) return getP(ref.sl)||'?';
  if(ref.tc!==undefined) return '3°#'+ref.tc;
  return '?';
}

function mostrarPalpites(){
  var idx=document.getElementById('selPart').value;
  if(idx===''){
    document.getElementById('palpitesWrap').innerHTML='<div class="empty">Selecione um participante acima.</div>';
    document.getElementById('statsWrap').innerHTML='';
    return;
  }
  var p=participantes[idx];
  if(!p) return;
  var pal=p.palpites||{};

  // Stats
  var total=0;
  for(var k in pal){var pp=pal[k];if(pp&&pp.a!=null&&pp.b!=null)total++;}
  document.getElementById('statsWrap').innerHTML=
    '<div class="stats">'
    +'<div class="stat"><div class="stat-n">'+total+'</div><div class="stat-l">Palpites</div></div>'
    +'</div>';

  var html='';

  // GRUPOS
  Object.keys(G).forEach(function(gl){
    var info=G[gl];
    html+='<div class="card"><div class="card-head grupo">&#9917; GRUPO '+gl+'</div>';
    info.jogos.forEach(function(j){
      var pp=pal['g'+j.id];
      var va=pp&&pp.a!=null?pp.a:null;
      var vb=pp&&pp.b!=null?pp.b:null;
      var temP=va!=null&&vb!=null;
      html+='<div class="jogo-row">'
        +'<span class="jnum">#'+j.id+'</span>'
        +'<span class="tname">'+j.t1+'</span>'
        +'<span class="placar'+(temP?'':' vazio')+'">'+(temP?va+'×'+vb:'—')+'</span>'
        +'<span class="tname r">'+j.t2+'</span>'
        +'</div>';
    });
    html+='</div>';
  });

  // ELIMINATORIAS
  var fases=[
    {label:'SEGUNDAS DE FINAL',jogos:SEG,cls:'seg'},
    {label:'OITAVAS DE FINAL',jogos:OIT,cls:'oit'},
    {label:'QUARTAS DE FINAL',jogos:QUA,cls:'qua'},
    {label:'SEMIFINAIS',jogos:SEMI,cls:'semi'},
    {label:'3° LUGAR E FINAL',jogos:[TERC,FINAL],cls:'final'}
  ];
  fases.forEach(function(fase){
    html+='<div class="card"><div class="card-head '+fase.cls+'">'+fase.label+'</div>';
    fase.jogos.forEach(function(j){
      var pp=pal['mm'+j.id];
      var va=pp&&pp.a!=null?pp.a:null;
      var vb=pp&&pp.b!=null?pp.b:null;
      var t1=pp&&pp.t1?pp.t1:resolveTime(j.t1,pal);
      var t2=pp&&pp.t2?pp.t2:resolveTime(j.t2,pal);
      var temP=va!=null&&vb!=null;
      html+='<div class="jogo-row">'
        +'<span class="jnum">#'+j.id+'</span>'
        +'<span class="tname">'+t1+'</span>'
        +'<span class="placar'+(temP?'':' vazio')+'">'+(temP?va+'×'+vb:'—')+'</span>'
        +'<span class="tname r">'+t2+'</span>'
        +'</div>';
    });
    html+='</div>';
  });

  document.getElementById('palpitesWrap').innerHTML=html;
}

window.entrar=entrar;
window.mostrarPalpites=mostrarPalpites;
</script>
</body>
</html>

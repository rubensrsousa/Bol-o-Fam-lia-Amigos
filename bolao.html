// ============================================================
// MOTOR DE CLASSIFICAÇÃO (baseado nos palpites do participante)
// ============================================================
function classificarGrupo(gl, palpites) {
  var info = G[gl], pts={}, sg={}, gp={};
  info.times.forEach(function(t){pts[t]=0;sg[t]=0;gp[t]=0;});
  info.jogos.forEach(function(j){
    var p = palpites['g'+j.id];
    if(!p||p.a==null||p.b==null) return;
    var a=+p.a,b=+p.b; if(isNaN(a)||isNaN(b)) return;
    gp[j.t1]+=a;gp[j.t2]+=b;
    sg[j.t1]+=(a-b);sg[j.t2]+=(b-a);
    if(a>b){pts[j.t1]+=3;}else if(a<b){pts[j.t2]+=3;}else{pts[j.t1]+=1;pts[j.t2]+=1;}
  });
  return info.times.slice().sort(function(a,b){
    if(pts[b]!==pts[a])return pts[b]-pts[a];
    if(sg[b]!==sg[a])return sg[b]-sg[a];
    return gp[b]-gp[a];
  }).map(function(t){return{nome:t,pts:pts[t],sg:sg[t],gp:gp[t]};});
}

function calcTerceiros(palpites) {
  var lista=[];
  Object.keys(G).forEach(function(gl){
    var r=classificarGrupo(gl,palpites);
    var temP=G[gl].jogos.some(function(j){var p=palpites['g'+j.id];return p&&p.a!=null&&p.b!=null;});
    lista.push({nome:temP?r[2].nome:null,grupo:gl,pts:r[2].pts,sg:r[2].sg,gp:r[2].gp,tem:temP});
  });
  lista.sort(function(a,b){
    if(!a.tem&&!b.tem)return 0;if(!a.tem)return 1;if(!b.tem)return -1;
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.sg!==a.sg)return b.sg-a.sg;
    return b.gp-a.gp;
  });
  return lista;
}

function resolveGrupo(ref, palpites) {
  if(ref.g){
    var r=classificarGrupo(ref.g,palpites);
    var tem=G[ref.g].jogos.some(function(j){var p=palpites['g'+j.id];return p&&p.a!=null&&p.b!=null;});
    if(!tem)return null;
    return r[ref.p-1]?r[ref.p-1].nome:null;
  }
  if(ref.tc!==undefined){
    var tc=calcTerceiros(palpites);
    var item=tc[ref.tc-1];
    return (item&&item.nome)?item.nome+'(3°'+item.grupo+')':null;
  }
  return null;
}

// Resolve vencedor de uma segunda/oitava/quarta/semi a partir dos palpites
function resolveVencedor(jogoId, palpites) {
  var p = palpites['mm'+jogoId];
  if(!p||p.v==null) return null;
  // p.v = nome do time vencedor (digitado/salvo)
  return p.v||null;
}

function resolvePerdedor(jogoId, palpites) {
  var p = palpites['mm'+jogoId];
  if(!p||p.v==null) return null;
  return p.p||null;
}

function resolveTimeSegunda(ref, palpites) {
  if(ref.g||ref.tc!==undefined) return resolveGrupo(ref,palpites);
  if(ref.s!==undefined) return resolveVencedor(ref.s,palpites);
  if(ref.o!==undefined) return resolveVencedor(ref.o,palpites);
  if(ref.q!==undefined) return resolveVencedor(ref.q,palpites);
  if(ref.sv!==undefined) return resolveVencedor(ref.sv,palpites);
  if(ref.sl!==undefined) return resolvePerdedor(ref.sl,palpites);
  return null;
}

// Normaliza nome: minúsculas, sem acentos, espaços viram _
function normalizar(nome){
  return nome.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'_')
    .replace(/_+/g,'_')
    .replace(/^_|_$/g,'');
}

// Recalcula vencedores/perdedores de todos os jogos do mata-mata
// Roda múltiplas passagens para garantir cascata completa (Seg→Oit→Qua→Semi→Final)
function recalcularTodosMM(skipSave){
  var todasMM=[].concat(SEG,OIT,QUA,SEMI,[TERC,FINAL]);
  var alterou=false;

  // Múltiplas passagens para garantir cascata completa
  for(var passagem=0; passagem<6; passagem++){
    todasMM.forEach(function(jogo){
      var pp=P['mm'+jogo.id];
      if(!pp||pp.a==null||pp.b==null) return;

      // Resolve team names: screen input > saved > auto-calculated
      var t1El=document.getElementById('mm'+jogo.id+'t1');
      var t2El=document.getElementById('mm'+jogo.id+'t2');
      var t1Screen=t1El?t1El.value.trim():'';
      var t2Screen=t2El?t2El.value.trim():'';
      var t1=t1Screen||pp.t1||resolveTimeSegunda(jogo.t1,P)||'';
      var t2=t2Screen||pp.t2||resolveTimeSegunda(jogo.t2,P)||'';

      // Always update saved names
      if(t1&&pp.t1!==t1){ pp.t1=t1; alterou=true; }
      if(t2&&pp.t2!==t2){ pp.t2=t2; alterou=true; }

      // Use final resolved names
      var nt1=t1;
      var nt2=t2;

      // Calculate winner/loser
      if(nt1&&nt2){
        var a=+pp.a,b=+pp.b;
        var novoV=a>b?nt1:b>a?nt2:null;
        var novoP=a>b?nt2:b>a?nt1:null;
        if(novoV!==pp.v||novoP!==pp.p){
          pp.v=novoV; pp.p=novoP; alterou=true;
        }
      }
    });
  }

  // Save updated palpites back to Firebase silently if anything changed
  if(alterou && docRef && !skipSave){
    docRef.set({nome:nomeParticipante,palpites:P,ts:Date.now()},{merge:true}).catch(function(){});
  }
}

window.updTime = function(id, side, val){
  if(BLOQUEADO) return;
  if(!P['mm'+id]) P['mm'+id]={a:null,b:null};
  if(side===0) P['mm'+id].t1=val.trim();
  else P['mm'+id].t2=val.trim();
  // Recalculate winner/loser when team name changes
  var pp=P['mm'+id];
  if(pp.a!=null&&pp.b!=null&&pp.t1&&pp.t2){
    var a=+pp.a,b=+pp.b;
    if(a>b){pp.v=pp.t1;pp.p=pp.t2;}
    else if(b>a){pp.v=pp.t2;pp.p=pp.t1;}
    else{pp.v=null;pp.p=null;}
  }
  var aEl=document.getElementById('mm'+id+'a');
  var bEl=document.getElementById('mm'+id+'b');
  if(aEl) aEl.disabled=false;
  if(bEl) bEl.disabled=false;
  // Update downstream phases
  updSegundas();updOitavas();updQuartas();updSemi();updFinal();
  if(docRef) docRef.set({nome:nomeParticipante,palpites:P,ts:Date.now()},{merge:true}).catch(function(){});
};

window.upd = function(tipo,id,side,val){
  if(BLOQUEADO) return;
  // Verifica bloqueio individual do jogo
  if(tipo==='g'){
    var bloqueioJogo = JOGOS_BLOQUEIO[id];
    if(bloqueioJogo && new Date() >= bloqueioJogo){
      showToast('&#128274; Jogo #'+id+' já começou — palpite bloqueado!');
      // Restaura valor anterior
      var el=document.getElementById(tipo+id+side);
      var pp=P[tipo+id]||{};
      if(el) el.value=side==='a'?(pp.a!=null?pp.a:''):(pp.b!=null?pp.b:'');
      return;
    }
  }
  val=val.replace(/[^0-9]/g,'').substring(0,2);
  var key=tipo+id;
  if(!P[key])P[key]={a:null,b:null};
  P[key][side]=val!==''?parseInt(val):null;
  // Se tiver os dois lados, tenta calcular vencedor automaticamente
  if(tipo==='mm'&&P[key].a!=null&&P[key].b!=null){
    var jogo=findJogo(id);
    if(jogo){
      // Get team names from screen inputs first, then fallback to auto-resolve
      var t1ElVal=document.getElementById('mm'+id+'t1');
      var t2ElVal=document.getElementById('mm'+id+'t2');
      var t1Screen=t1ElVal?t1ElVal.value.trim():'';
      var t2Screen=t2ElVal?t2ElVal.value.trim():'';
      var t1=t1Screen||resolveTimeSegunda(jogo.t1,P)||P[key].t1||'';
      var t2=t2Screen||resolveTimeSegunda(jogo.t2,P)||P[key].t2||'';
      // Always update t1/t2 with current values
      if(t1) P[key].t1=t1;
      if(t2) P[key].t2=t2;
      if(t1&&t2){
        var a=+P[key].a,b=+P[key].b;
        if(a>b){P[key].v=t1;P[key].p=t2;}
        else if(b>a){P[key].v=t2;P[key].p=t1;}
        else{P[key].v=null;P[key].p=null;}
      }
    }
  }
  var el=document.getElementById(tipo+id+side);
  if(el){if(val!=='')el.classList.add('ok');else el.classList.remove('ok');}
  // Recalculate all MM winners in cascade
  recalcularTodosMM(true);
  updClassificados();updTerceiros();updSegundas();updOitavas();updQuartas();updSemi();updFinal();updProg();
  // Auto-salva a cada mudança
  if(docRef) docRef.set({nome:nomeParticipante,palpites:P,ts:Date.now()},{merge:true}).catch(function(){});
};

function findJogo(id){
  var todas=[].concat(SEG,OIT,QUA,SEMI,[TERC,FINAL]);
  for(var i=0;i<todas.length;i++){if(todas[i].id===id)return todas[i];}
  return null;
}

function showToast(msg){
  var t=document.getElementById('toastEl');
  t.innerHTML=msg;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},2500);
}

window.gerarComprovante = function(){
  if(!nomeParticipante){showToast('Digite seu nome primeiro!');return;}
  var txt='🏆 BOLÃO COPA 2026\n👤 '+nomeParticipante+'\n';
  txt+='━━━━━━━━━━━━━━━━━━━━\n';
  var gkeys=Object.keys(G);
  for(var gi=0;gi<gkeys.length;gi++){
    var gl=gkeys[gi],info=G[gl];
    txt+='\n⚽ GRUPO '+gl+'\n';
    for(var ji=0;ji<info.jogos.length;ji++){
      var j=info.jogos[ji];
      var pp=P['g'+j.id];
      var va=pp&&pp.a!=null?pp.a:'?';
      var vb=pp&&pp.b!=null?pp.b:'?';
      txt+='  #'+j.id+' '+j.t1+' '+va+'×'+vb+' '+j.t2+'\n';
    }
  }
  txt+='\n━━━━━━━━━━━━━━━━━━━━\n';
  txt+='Salvo em '+new Date().toLocaleString('pt-BR');
  navigator.clipboard.writeText(txt).then(function(){
    showToast('📋 Copiado! Cole no WhatsApp.');
  }).catch(function(){
    var w=window.open('','_blank');
    if(w) w.document.write('<pre style="font-family:monospace;padding:20px;font-size:13px">'+txt+'</pre>');
    else showToast('Não foi possível copiar.');
  });
};

window.entrar = entrar;
